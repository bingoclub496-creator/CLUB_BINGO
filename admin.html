<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Panel Maestro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004d61; --accent: #ffc107; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Izquierdo */
        .sidebar { width: 380px; background: var(--primary); color: white; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.2); }
        .sala-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .timer { font-family: monospace; font-size: 1.4rem; color: var(--accent); margin: 10px 0; text-align: center; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 8px; }
        
        /* Contenido Principal */
        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* Buscador */
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; position: sticky; top: 0; background: white; padding: 10px 0; z-index: 10; }
        .search-bar input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }

        /* Tabla de Socios */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #f8f9fa; padding: 12px; text-align: left; color: var(--primary); position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }

        /* Botones y Badges */
        .btn { border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-sync { background: #25D366; color: white; width: 100%; margin-top: 10px; }
        .btn-copy { background: #e3f2fd; color: #1976d2; padding: 5px 10px; font-size: 0.8rem; }
        .btn-on { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .btn-off { background: #ffebee; color: #c62828; border: 1px solid #c62828; }
        
        code { background: #eee; padding: 2px 5px; border-radius: 4px; font-weight: bold; color: #d32f2f; }

        /* Modal */
        #modalSocio { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:2000; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-server"></i> Bingo Club Admin</h2>
        <hr style="opacity:0.2">
        
        <div class="sala-box">
            <h3 style="margin:0; color:var(--accent);">SALA NORMAL</h3>
            <div class="timer" id="count_normal">--:--:--</div>
            <label>Pote Inicial (Bs):</label>
            <input type="number" id="poteInit_normal" class="btn" style="width:100%; margin:5px 0; background:white;" value="100" onchange="recalcularPotes()">
            <label>Fecha/Hora Inicio:</label>
            <input type="datetime-local" id="time_normal" class="btn" style="width:100%; background:white;">
            <div id="info_normal" style="font-size:0.85rem; margin-top:10px; color:#25D366;"></div>
            <button class="btn btn-sync" id="btnSync_normal" onclick="sincronizar('normal')">SINCRONIZAR SALA</button>
        </div>

        <div class="sala-box" style="border-color: #25D366;">
            <h3 style="margin:0; color:#25D366;">CARTÓN LLENO</h3>
            <div class="timer" id="count_carton">--:--:--</div>
            <label>Pote Inicial (Bs):</label>
            <input type="number" id="poteInit_carton" class="btn" style="width:100%; margin:5px 0; background:white;" value="500" onchange="recalcularPotes()">
            <label>Fecha/Hora Inicio:</label>
            <input type="datetime-local" id="time_carton" class="btn" style="width:100%; background:white;">
            <div id="info_carton" style="font-size:0.85rem; margin-top:10px; color:#25D366;"></div>
            <button class="btn btn-sync" id="btnSync_carton" onclick="sincronizar('carton_lleno')">SINCRONIZAR SALA</button>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <div class="search-bar">
                <input type="text" id="busqueda" placeholder="🔍 Buscar por nombre o teléfono..." onkeyup="filtrarSocios()">
                <button class="btn" style="background:var(--primary); color:white;" onclick="abrirModal()">+ NUEVO SOCIO</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Socio / Teléfono</th>
                        <th>Credenciales</th>
                        <th>Sala / Cartones</th>
                        <th>Estado Pago</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaSocios"></tbody>
            </table>
        </div>
    </div>

    <div id="modalSocio">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--primary);">Registrar Socio</h3>
            <input type="text" id="newNom" placeholder="Nombre Completo">
            <input type="text" id="newTel" placeholder="Número de Teléfono (Ej: 0426...)">
            <input type="text" id="newUser" placeholder="Nombre de Usuario">
            <button class="btn btn-sync" onclick="guardarSocio()">GENERAR ACCESO</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#eee;" onclick="document.getElementById('modalSocio').style.display='none'">CANCELAR</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sociosLocales = [];

    // --- GENERADOR DE CLAVE ---
    const generarClave = () => Math.random().toString(36).substring(2, 6).toUpperCase();

    // --- ESCUCHA DE DATOS ---
    onSnapshot(collection(db, "socios"), (snap) => {
        sociosLocales = [];
        snap.forEach(d => sociosLocales.push({id: d.id, ...d.data()}));
        renderizarTabla(sociosLocales);
        recalcularPotes();
    });

    function renderizarTabla(lista) {
        const tbody = document.getElementById('listaSocios');
        tbody.innerHTML = '';
        lista.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${s.nombre}</b><br><small><i class="fas fa-phone"></i> ${s.telefono || 'Sin registro'}</small></td>
                <td>
                    U: <code>${s.usuario}</code><br>
                    P: <code>${s.password}</code>
                </td>
                <td>
                    <select onchange="actualizarSocio('${s.id}', {idSala: this.value})">
                        <option value="normal" ${s.idSala==='normal'?'selected':''}>S. Normal</option>
                        <option value="carton_lleno" ${s.idSala==='carton_lleno'?'selected':''}>C. Lleno</option>
                    </select>
                    <select onchange="actualizarSocio('${s.id}', {cartones: parseInt(this.value)})">
                        ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${s.cartones==n?'selected':''}>${n}C</option>`).join('')}
                    </select>
                </td>
                <td>
                    <button class="btn btn-status ${s.activo?'btn-on':'btn-off'}" onclick="actualizarSocio('${s.id}', {activo: ${!s.activo}})">
                        ${s.activo?'PAGADO':'PENDIENTE'}
                    </button>
                </td>
                <td>
                    <button class="btn btn-copy" onclick="copiarAcceso('${s.nombre}','${s.usuario}','${s.password}')">
                        <i class="fab fa-whatsapp"></i> COPIAR
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- FILTRO BÚSQUEDA ---
    window.filtrarSocios = () => {
        const txt = document.getElementById('busqueda').value.toLowerCase();
        const filtrados = sociosLocales.filter(s => 
            s.nombre.toLowerCase().includes(txt) || (s.telefono && s.telefono.includes(txt))
        );
        renderizarTabla(filtrados);
    };

    // --- COPIAR WHATSAPP ---
    window.copiarAcceso = (nombre, user, pass) => {
        const link = "https://bingoclub496-creator.github.io/CLUB_BINGO/";
        const texto = `*¡Hola ${nombre}!* 👋 Bienvenido a *Bingo Club* 🏆\n\nTus credenciales de acceso son:\n👤 *Usuario:* ${user}\n🔑 *Clave:* ${pass}\n\nPuedes ingresar aquí:\n🔗 ${link}\n\n_¡Mucha suerte!_ 🍀`;
        
        navigator.clipboard.writeText(texto).then(() => {
            alert("✅ ¡Copiado! Pégalo en el chat de " + nombre);
        });
    };

    // --- MATEMÁTICA POTES (REGLA 4%) ---
    window.recalcularPotes = async () => {
        const tipos = ['normal', 'carton_lleno'];
        for(let t of tipos) {
            const pInit = parseFloat(document.getElementById(t==='normal'?'poteInit_normal':'poteInit_carton').value) || 0;
            const activos = sociosLocales.filter(s => s.activo && s.idSala === t);
            const totalCartones = activos.reduce((acc, curr) => acc + (curr.cartones || 1), 0);
            
            const incremento = pInit * 0.04 * totalCartones;
            const pFinal = pInit + incremento;
            
            document.getElementById(`info_${t}`).innerHTML = `<b>Pote: Bs. ${pFinal.toFixed(2)}</b><br><small>Cartones en juego: ${totalCartones}</small>`;
            
            const docID = t === 'normal' ? 'SALA_NORMAL_ID' : 'SALA_CARTON_ID';
            await setDoc(doc(db, "salas", docID), { premioBs: pFinal.toFixed(2), cartonesJugando: totalCartones }, {merge:true});
        }
    };

    // --- SINCRONIZACIÓN Y MENSAJE ---
    window.sincronizar = async (tipo) => {
        const btn = document.getElementById('btnSync_'+tipo);
        const hora = document.getElementById(tipo === 'normal' ? 'time_normal' : 'time_carton').value;
        if(!hora) return alert("Selecciona la hora primero");

        const docID = tipo === 'normal' ? 'SALA_NORMAL_ID' : 'SALA_CARTON_ID';
        await updateDoc(doc(db, "salas", docID), { horaInicio: hora });

        btn.innerText = "✅ ¡SINCRONIZADO!";
        btn.style.background = "#004d61";
        setTimeout(() => { btn.innerText = "SINCRONIZAR SALA"; btn.style.background = "#25D366"; }, 2000);
    };

    // --- CONTADOR REGRESIVO ---
    setInterval(() => {
        ['normal', 'carton_lleno'].forEach(t => {
            const val = document.getElementById(t==='normal'?'time_normal':'time_carton').value;
            if(!val) return;
            const diff = new Date(val) - new Date();
            const display = document.getElementById('count_'+t);
            if(diff <= 0) { display.innerText = "¡EN JUEGO!"; display.style.color = "#25D366"; return; }
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff%3600000)/60000);
            const s = Math.floor((diff%60000)/1000);
            display.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            display.style.color = "var(--accent)";
        });
    }, 1000);

    window.actualizarSocio = async (id, data) => await updateDoc(doc(db, "socios", id), data);
    window.abrirModal = () => document.getElementById('modalSocio').style.display = 'flex';
    
    window.guardarSocio = async () => {
        const n = document.getElementById('newNom').value;
        const t = document.getElementById('newTel').value;
        const u = document.getElementById('newUser').value;
        if(!n || !u) return alert("Nombre y Usuario obligatorios");

        await addDoc(collection(db, "socios"), {
            nombre: n, telefono: t, usuario: u,
            password: generarClave(),
            activo: false, cartones: 1, idSala: 'normal'
        });
        document.getElementById('modalSocio').style.display = 'none';
        document.getElementById('newNom').value = ""; document.getElementById('newTel').value = ""; document.getElementById('newUser').value = "";
    };
</script>
</body>
</html>

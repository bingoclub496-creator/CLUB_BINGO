<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Admin Master Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #25D366; --bg: #004d61; --card-bg: rgba(255,255,255,0.1); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        
        .admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        
        h2 { font-size: 1rem; color: var(--accent); text-transform: uppercase; margin-top: 0; border-bottom: 1px solid rgba(37, 211, 102, 0.2); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: none; background: white; color: #333; font-weight: bold; }
        
        button { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%; transition: 0.3s; text-transform: uppercase; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        /* Estilo de la Sala Activa */
        .sala-activa { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; margin-bottom: 20px; border-left: 5px solid var(--accent); }
        .controles-sala { display: flex; gap: 10px; margin: 15px 0; }
        .btn-bola { background: #ffc107; color: black; flex: 2; }
        .btn-stop { background: #ff5252; flex: 1; }
        
        .bolas-historial { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; min-height: 40px; }
        .bola-item { width: 25px; height: 25px; background: white; color: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }

        .tabla-socios { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 15px; }
        .tabla-socios th { text-align: left; padding: 10px; border-bottom: 2px solid var(--accent); color: var(--accent); }
        .tabla-socios td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .badge-codigo { background: var(--accent); color: black; padding: 2px 8px; border-radius: 5px; font-family: monospace; font-weight: bold; }

        #toast { display:none; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--accent); color:white; padding:12px 30px; border-radius:50px; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

    <div style="text-align:center; margin-bottom: 30px;">
        <h1 style="margin:0; font-size: 1.8rem; color: white;">BINGO CLUB <span style="color:var(--accent)">MASTER PRO</span></h1>
        <p style="opacity: 0.6; margin: 5px 0;">Panel de Control Administrativo v3.0</p>
    </div>

    <div class="admin-grid">
        <div class="column">
            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> Nueva Sala</h2>
                <input type="text" id="nombreSala" placeholder="Nombre: Ej. Gran Bingo Vegas">
                <select id="tipoSala">
                    <option value="normal">Normal (Línea / Cruz)</option>
                    <option value="cartonLleno">Cartón Lleno</option>
                </select>
                <input type="number" id="premioInicial" placeholder="Pote Inicial (Bs)">
                <input type="datetime-local" id="fechaSorteo">
                <button onclick="crearSalaMaster()">Publicar Sala</button>
            </div>

            <div class="card">
                <h2><i class="fas fa-user-plus"></i> Registrar Socio</h2>
                <input type="text" id="nombreSocio" placeholder="Nombre completo del cliente">
                <select id="selectSalasDisponibles"><option>Cargando salas...</option></select>
                <select id="cantCartones">
                    <option value="1">1 Cartón</option>
                    <option value="2">2 Cartones</option>
                    <option value="3">3 Cartones</option>
                    <option value="4">4 Cartones</option>
                </select>
                <button onclick="vincularSocioASala()" style="background:#1976d2;">Registrar y Generar Código</button>
            </div>
        </div>

        <div class="column">
            <div class="card">
                <h2><i class="fas fa-broadcast-tower"></i> Salas Activas y Monitoreo</h2>
                <div id="contenedorTablas">
                    </div>
            </div>
        </div>
    </div>

    <div id="toast">Acción exitosa</div>

    <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Admin Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004d61; --accent: #ffc107; --bg: #f4f7f6; --danger: #d32f2f; --success: #25D366; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        
        /* LOGIN DE SEGURIDAD */
        #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:10000; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white; }
        #loginOverlay input { padding:15px; border-radius:10px; border:none; margin-top:10px; width:250px; text-align:center; font-size:1.2rem; }

        /* INTERFAZ PRINCIPAL (Oculta hasta loguearse) */
        #adminApp { display: none; height: 100vh; flex-direction: row; }
        .sidebar { width: 380px; background: var(--primary); color: white; padding: 20px; overflow-y: auto; }
        .sala-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .timer { font-family: monospace; font-size: 1.5rem; color: var(--accent); margin: 10px 0; text-align: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn { border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-sync { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        
        /* ALERTA BINGO */
        #overlayBingo { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(211,47,47,0.95); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <i class="fas fa-lock" style="font-size: 3rem;"></i>
        <h2>Acceso Restringido</h2>
        <input type="password" id="passMaster" placeholder="Ingresa Clave Maestra" onkeyup="verificarLogin(event)">
        <p style="font-size:0.8rem; margin-top:10px; opacity:0.7;">Solo personal autorizado</p>
    </div>

    <div id="adminApp">
        <div id="overlayBingo">
            <h1 style="font-size: 4rem;">¡BINGO!</h1>
            <h2 id="ganadorNombre">---</h2>
            <button class="btn" style="background:white; color:var(--danger); padding: 20px;" onclick="verificarYNotificar()">VERIFICAR EN WHATSAPP</button>
            <audio id="audioAlerta" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" loop></audio>
        </div>

        <div class="sidebar">
            <h2>Bingo Club Admin</h2>
            <hr style="opacity:0.2">
            <div class="sala-box">
                <h3>SALA NORMAL</h3>
                <div class="timer" id="timer_normal">--:--:--</div>
                <label>Pote Inicial (Bs):</label>
                <input type="number" id="poteInit_normal" class="btn" style="width:100%; margin:5px 0;" value="100" onchange="recalcularPotes()">
                <input type="datetime-local" id="time_normal" class="btn" style="width:100%;">
                <div id="disp_normal" style="font-weight:bold; color:var(--success); margin-top:5px;"></div>
                <button class="btn btn-sync" onclick="sincronizar('normal')">SINCRONIZAR</button>
            </div>
            <div class="sala-box" style="border-color: var(--success);">
                <h3>CARTÓN LLENO</h3>
                <div class="timer" id="timer_carton_lleno">--:--:--</div>
                <label>Pote Inicial (Bs):</label>
                <input type="number" id="poteInit_carton_lleno" class="btn" style="width:100%; margin:5px 0;" value="500" onchange="recalcularPotes()">
                <input type="datetime-local" id="time_carton_lleno" class="btn" style="width:100%;">
                <div id="disp_carton_lleno" style="font-weight:bold; color:var(--success); margin-top:5px;"></div>
                <button class="btn btn-sync" onclick="sincronizar('carton_lleno')">SINCRONIZAR</button>
            </div>
        </div>

        <div class="main">
            <div class="card">
                <input type="text" id="busqueda" placeholder="Buscar socio..." onkeyup="filtrarSocios()" style="width:70%; padding:10px; border-radius:10px; border:1px solid #ddd;">
                <button class="btn" style="background:var(--primary); color:white;" onclick="abrirModal()">+ NUEVO SOCIO</button>
                <table style="margin-top:20px; width:100%;">
                    <thead><tr><th>Socio</th><th>Claves</th><th>Sala</th><th>Pago</th><th>WhatsApp</th></tr></thead>
                    <tbody id="listaSocios"></tbody>
                </table>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // SEGURIDAD
    const CLAVE_MAESTRA = "ADMIN496";
    window.verificarLogin = (e) => {
        if(e.key === "Enter" || !e.key) {
            if(document.getElementById('passMaster').value === CLAVE_MAESTRA) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminApp').style.display = 'flex';
            } else { alert("Clave Incorrecta"); }
        }
    };

    let sociosLocales = [];
    let horarios = { normal: null, carton_lleno: null };
    let ganador = null;

    // ESCUCHA ALERTAS
    onSnapshot(collection(db, "alertas"), (s) => {
        s.docChanges().forEach(change => {
            if(change.type === "added") {
                ganador = { ...change.doc.data(), id: change.doc.id };
                document.getElementById('ganadorNombre').innerText = ganador.nombre;
                document.getElementById('overlayBingo').style.display = 'flex';
                document.getElementById('audioAlerta').play().catch(()=>{});
            }
        });
    });

    window.verificarYNotificar = async () => {
        window.open(`https://wa.me/${ganador.telefono.replace(/\D/g,'')}?text=Bingo!`, '_blank');
        document.getElementById('overlayBingo').style.display = 'none';
        document.getElementById('audioAlerta').pause();
        await deleteDoc(doc(db, "alertas", ganador.id));
    };

    // ESCUCHA SALAS (CORREGIDO ID DE CARTÓN LLENO)
    onSnapshot(collection(db, "salas"), (snap) => {
        snap.forEach(d => {
            const id = d.id;
            if(id === "SALA_NORMAL_ID") horarios.normal = d.data().horaInicio;
            if(id === "SALA_CARTON_ID") horarios.carton_lleno = d.data().horaInicio;
        });
    });

    // ESCUCHA SOCIOS
    onSnapshot(collection(db, "socios"), (snap) => {
        sociosLocales = [];
        snap.forEach(d => sociosLocales.push({id: d.id, ...d.data()}));
        renderizar();
        recalcularPotes();
    });

    function renderizar() {
        const tb = document.getElementById('listaSocios');
        tb.innerHTML = '';
        sociosLocales.forEach(s => {
            tb.innerHTML += `<tr>
                <td>${s.nombre}<br><small>${s.telefono}</small></td>
                <td>U: ${s.usuario}<br>P: ${s.password}</td>
                <td><select onchange="upd('${s.id}',{idSala:this.value})"><option value="normal" ${s.idSala=='normal'?'selected':''}>Normal</option><option value="carton_lleno" ${s.idSala=='carton_lleno'?'selected':''}>C. Lleno</option></select></td>
                <td><button onclick="upd('${s.id}',{activo:${!s.activo}})" class="btn ${s.activo?'btn-sync':''}">${s.activo?'PAGADO':'PENDIENTE'}</button></td>
                <td><button class="btn" onclick="copy('${s.nombre}','${s.usuario}','${s.password}')">Link</button></td>
            </tr>`;
        });
    }

    window.sincronizar = async (t) => {
        const hora = document.getElementById('time_'+t).value;
        const docId = (t === 'normal') ? "SALA_NORMAL_ID" : "SALA_CARTON_ID";
        await updateDoc(doc(db, "salas", docId), { horaInicio: hora });
        alert("Sincronizado");
    };

    window.recalcularPotes = async () => {
        ['normal', 'carton_lleno'].forEach(async t => {
            const pInit = parseFloat(document.getElementById('poteInit_'+t).value) || 0;
            const cant = sociosLocales.filter(s => s.activo && s.idSala === t).reduce((acc,curr)=>acc+(curr.cartones||1),0);
            const total = pInit + (pInit * 0.04 * cant);
            document.getElementById('disp_'+t).innerText = "Pote: Bs. " + total.toFixed(2);
            const docId = (t === 'normal') ? "SALA_NORMAL_ID" : "SALA_CARTON_ID";
            await setDoc(doc(db, "salas", docId), { premioBs: total.toFixed(2), cartonesJugando: cant }, {merge:true});
        });
    };

    setInterval(() => {
        ['normal', 'carton_lleno'].forEach(t => {
            const meta = horarios[t];
            const div = document.getElementById('timer_'+t);
            if(!meta) return;
            const diff = new Date(meta) - new Date();
            if(diff <= 0) { div.innerText = "¡EN JUEGO!"; return; }
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            div.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        });
    }, 1000);

    window.upd = async (id, data) => await updateDoc(doc(db, "socios", id), data);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Consola de Mando</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004d61; --accent: #ffc107; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        
        /* Lateral */
        .sidebar { width: 350px; background: var(--primary); color: white; padding: 25px; box-shadow: 4px 0 10px rgba(0,0,0,0.2); }
        .sala-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .input-dark { background: rgba(0,0,0,0.3); border: 1px solid #555; color: white; padding: 8px; border-radius: 5px; width: 100%; margin-top: 5px; }
        
        /* Contenido */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .header-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* Tabla */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--primary); border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn { border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-sync { background: #25D366; color: white; width: 100%; margin-top: 10px; }
        .btn-on { background: #e8f5e9; color: #2e7d32; }
        .btn-off { background: #ffebee; color: #c62828; }

        /* Modal */
        #modalSocio { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; }
        .modal-content { background:white; padding:30px; border-radius:20px; width:350px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-cog"></i> Configurador</h2>
        <hr style="opacity:0.2">
        
        <div class="sala-box">
            <h3>SALA NORMAL</h3>
            <label>Pote Inicial (Bs):</label>
            <input type="number" id="poteInit_normal" class="input-dark" value="100" onchange="actualizarPremios('normal')">
            <label>Inicio del Juego:</label>
            <input type="datetime-local" id="time_normal" class="input-dark">
            <button class="btn btn-sync" onclick="sincronizar('normal')">SINCRONIZAR SALA</button>
        </div>

        <div class="sala-box" style="border-color: #25D366;">
            <h3>CARTÓN LLENO</h3>
            <label>Pote Inicial (Bs):</label>
            <input type="number" id="poteInit_carton" class="input-dark" value="500" onchange="actualizarPremios('carton_lleno')">
            <label>Inicio del Juego:</label>
            <input type="datetime-local" id="time_carton" class="input-dark">
            <button class="btn btn-sync" onclick="sincronizar('carton_lleno')">SINCRONIZAR SALA</button>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <div class="header-main">
                <h2>Socios Registrados</h2>
                <button class="btn btn-add" onclick="abrirModal()">+ NUEVO SOCIO</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Socio / Usuario</th>
                        <th>Sala</th>
                        <th>Cartones</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaSocios"></tbody>
            </table>
        </div>
    </div>

    <div id="modalSocio">
        <div class="modal-content">
            <h3>Nuevo Socio</h3>
            <input type="text" id="newNom" placeholder="Nombre Real" class="input-dark" style="color:black; border:1px solid #ccc"><br><br>
            <input type="text" id="newUser" placeholder="Usuario (Login)" class="input-dark" style="color:black; border:1px solid #ccc"><br><br>
            <input type="password" id="newPass" placeholder="Contraseña" class="input-dark" style="color:black; border:1px solid #ccc"><br><br>
            <button class="btn btn-sync" onclick="guardarSocio()">CREAR SOCIO</button>
            <button class="btn" onclick="document.getElementById('modalSocio').style.display='none'">Cancelar</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let sociosLocales = [];

    // --- CARGAR SOCIOS Y CALCULAR POTES ---
    onSnapshot(collection(db, "socios"), (snap) => {
        const tbody = document.getElementById('listaSocios');
        tbody.innerHTML = '';
        sociosLocales = [];
        
        snap.forEach(d => {
            const s = d.data();
            const id = d.id;
            sociosLocales.push({id, ...s});

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${s.usuario}</b><br>${s.nombre}</td>
                <td>
                    <select onchange="actualizarSocio('${id}', {idSala: this.value})">
                        <option value="normal" ${s.idSala==='normal'?'selected':''}>Normal</option>
                        <option value="carton_lleno" ${s.idSala==='carton_lleno'?'selected':''}>Cartón Lleno</option>
                    </select>
                </td>
                <td>
                    <select onchange="actualizarSocio('${id}', {cartones: parseInt(this.value)})">
                        ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${s.cartones==n?'selected':''}>${n} Cartones</option>`).join('')}
                    </select>
                </td>
                <td>
                    <button class="btn ${s.activo?'btn-on':'btn-off'}" onclick="actualizarSocio('${id}', {activo: ${!s.activo}})">
                        ${s.activo?'ACTIVO':'INACTIVO'}
                    </button>
                </td>
                <td><i class="fas fa-trash" style="color:red; cursor:pointer"></i></td>
            `;
            tbody.appendChild(tr);
        });
        recalcularTodo();
    });

    // --- LÓGICA MATEMÁTICA DEL POTE ---
    // El pote sube 4% por cada cartón de socio activo. 
    // Fórmula: $$PoteFinal = PoteInicial + (PoteInicial \times 0.04 \times \text{TotalCartonesActivos})$$
    
    window.recalcularTodo = async () => {
        const salas = ['normal', 'carton_lleno'];
        
        for(let tipo of salas) {
            const pInit = parseFloat(document.getElementById(`poteInit_${tipo==='normal'?'normal':'carton'}`).value);
            const cartonesActivos = sociosLocales
                .filter(s => s.activo && s.idSala === tipo)
                .reduce((acc, curr) => acc + (curr.cartones || 1), 0);
            
            const nuevoPremio = pInit + (pInit * 0.04 * cartonesActivos);
            
            // Actualizamos en Firebase (Solo el premio acumulado)
            await updateDoc(doc(db, "salas", tipo === 'normal' ? 'SALA_NORMAL_ID' : 'SALA_CARTON_ID'), {
                premioBs: nuevoPremio.toFixed(2),
                totalCartones: cartonesActivos
            });
        }
    };

    window.actualizarSocio = async (id, data) => {
        await updateDoc(doc(db, "socios", id), data);
        recalcularTodo();
    };

    window.sincronizar = async (tipo) => {
        const time = document.getElementById(`time_${tipo==='normal'?'normal':'carton'}`).value;
        const idDoc = tipo === 'normal' ? 'SALA_NORMAL_ID' : 'SALA_CARTON_ID';
        await updateDoc(doc(db, "salas", idDoc), { fechaInicio: time });
        alert("¡Sala Sincronizada!");
    };

    // --- GESTIÓN DE NUEVO SOCIO ---
    window.abrirModal = () => document.getElementById('modalSocio').style.display='flex';
    
    window.guardarSocio = async () => {
        const user = document.getElementById('newUser').value;
        const pass = document.getElementById('newPass').value;
        const nom = document.getElementById('newNom').value;
        
        if(!user || !pass) return alert("Completa los datos");

        await addDoc(collection(db, "socios"), {
            usuario: user,
            password: pass,
            nombre: nom,
            cartones: 1,
            idSala: "normal",
            activo: false
        });
        
        document.getElementById('modalSocio').style.display='none';
        alert("Socio Creado");
    };
</script>
</body>
</html>

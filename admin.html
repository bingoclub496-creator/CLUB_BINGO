<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Admin Master Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #004d61; color: white; margin: 0; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; max-width: 1300px; margin: 0 auto; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 25px; padding: 20px; border: 1px solid rgba(255,255,255,0.2); position: relative; margin-bottom: 20px; }
        h2 { font-size: 1.1rem; color: #25D366; text-transform: uppercase; margin-top: 0; border-bottom: 1px solid rgba(37, 211, 102, 0.2); padding-bottom: 10px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: none; box-sizing: border-box; font-size: 1rem; }
        button { background: #25D366; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #1eb954; transform: translateY(-2px); }
        .sala-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-delete-sala { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 1.3rem; padding: 5px; }
        .tabla-socios { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; }
        th { text-align: left; padding: 12px; background: rgba(255,255,255,0.1); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        #toast { display:none; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#25D366; color:white; padding:12px 30px; border-radius:50px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* NUEVO: Estilo para la Alerta de Ganador (No afecta el resto) */
        #alertaBingo { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; 
            align-items:center; justify-content:center; text-align:center;
            border: 15px solid #25D366; animation: parpadeo 0.5s infinite alternate;
        }
        @keyframes parpadeo { from { opacity: 1; } to { opacity: 0.8; border-color: #ffc107; } }
    </style>
</head>
<body>

    <div id="alertaBingo">
        <h1 style="font-size: 5rem; color: #25D366; margin: 0;">¡BINGO CANTADO!</h1>
        <h2 id="winnerName" style="font-size: 3rem; color: white;">SOCIO</h2>
        <p id="winnerCode" style="font-size: 1.5rem; color: #ffc107;"></p>
        <button onclick="document.getElementById('alertaBingo').style.display='none'" style="width: auto; padding: 20px 50px; margin-top: 20px; background: #ff5252;">CERRAR ALERTA</button>
    </div>

    <div style="text-align:center; margin-bottom: 30px;">
        <img src="logo.png" width="70" onerror="this.style.display='none'">
        <h1 style="margin:10px 0; font-size: 1.6rem; letter-spacing: 1px;">SISTEMA ADMINISTRATIVO BINGO CLUB</h1>
    </div>

    <div class="admin-grid">
        <div class="column">
            <div class="card">
                <h2>1. Crear Nueva Sala</h2>
                <input type="text" id="nombreSala" placeholder="Nombre de la Sala (Ej: Sorteo de San Juan)">
                <select id="tipoSala">
                    <option value="normal">Normal (Línea / Cruz Grande)</option>
                    <option value="cartonLleno">Cartón Lleno (Todas las casillas)</option>
                </select>
                <input type="number" id="premioInicial" placeholder="Premio Base Inicial (Bs)">
                <input type="datetime-local" id="fechaSorteo">
                <button onclick="crearSalaMaster()"><i class="fas fa-plus"></i> PUBLICAR SALA EN RED</button>
            </div>

            <div class="card">
                <h2>2. Registrar Socio</h2>
                <input type="text" id="nombreSocio" placeholder="Nombre y Apellido">
                <select id="selectSalasDisponibles"><option value="">Cargando salas...</option></select>
                <label style="font-size: 0.8rem; display: block; margin: 5px 0 5px 5px;">Cartones comprados:</label>
                <select id="cantCartones">
                    <option value="1">1 Cartón (+4% Pote)</option>
                    <option value="2">2 Cartones</option>
                    <option value="3">3 Cartones</option>
                    <option value="4">4 Cartones</option>
                    <option value="5">5 Cartones</option>
                    <option value="6">6 Cartones</option>
                </select>
                <button onclick="vincularSocioASala()" style="background:#1976d2;"><i class="fas fa-user-plus"></i> VINCULAR Y GENERAR</button>
            </div>
        </div>

        <div class="column">
            <div class="card" style="min-height: 500px;">
                <h2>3. Gestión de Salas Activas</h2>
                <div id="contenedorTablas"></div>
            </div>
        </div>
    </div>

    <div id="toast">✅ ¡Acción realizada con éxito!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- REGISTRO CON AUMENTO DEL 4% ---
        window.vincularSocioASala = async () => {
            const nombre = document.getElementById('nombreSocio').value;
            const idSala = document.getElementById('selectSalasDisponibles').value;
            const cant = parseInt(document.getElementById('cantCartones').value);

            if(!nombre || !idSala) return alert("Faltan datos");

            const salaRef = doc(db, "salas", idSala);
            const salaSnap = await getDoc(salaRef);
            let poteActual = parseFloat(salaSnap.data().premioBs || salaSnap.data().premioInicial || 0);

            // Fórmula Interés Compuesto 4%
            let nuevoPote = poteActual * Math.pow(1.04, cant);
            const codigo = Math.random().toString(36).substring(2, 8).toUpperCase();

            await addDoc(collection(db, "socios"), {
                nombre, idSala, cantCartones: cant, codigoAcceso: codigo, cantoBingo: false
            });

            await updateDoc(salaRef, { premioBs: nuevoPote.toFixed(2) });
            
            showToast(`Socio registrado. Código: ${codigo}`);
            document.getElementById('nombreSocio').value = "";
        };

        // --- MONITOR DE ALERTAS ---
        onSnapshot(collection(db, "socios"), (snap) => {
            snap.docChanges().forEach(change => {
                const data = change.doc.data();
                if (change.type === "modified" && data.cantoBingo === true) {
                    document.getElementById('winnerName').innerText = data.nombre;
                    document.getElementById('winnerCode').innerText = "CÓDIGO: " + data.codigoAcceso;
                    document.getElementById('alertaBingo').style.display = 'flex';
                    new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3').play().catch(()=>{});
                }
            });
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = "✅ " + msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // Cargar Salas en Select
        onSnapshot(collection(db, "salas"), (snap) => {
            const select = document.getElementById('selectSalasDisponibles');
            select.innerHTML = '<option value="">Seleccione Sala...</option>';
            snap.forEach(d => {
                select.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
            });
        });
    </script>
</body>
</html>

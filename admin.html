<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Admin Maestro V7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004d61; --vip: #b8860b; --accent: #ffc107; --bg: #f4f7f6; --success: #25D366; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR ESTRUCUTRA */
        .sidebar { width: 400px; background: var(--primary); color: white; padding: 20px; overflow-y: auto; box-shadow: 4px 0 10px rgba(0,0,0,0.3); }
        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }

        /* SALAS BOX */
        .sala-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .timer { font-family: monospace; font-size: 1.4rem; color: var(--accent); text-align: center; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 5px; }

        /* TABLA SOCIOS */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #f8f9fa; padding: 10px; text-align: left; color: #666; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        .btn { border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-sync { background: var(--success); color: white; width: 100%; margin-top: 5px; }
        .btn-lanzador { background: var(--vip); color: white; width: 100%; margin-top: 5px; }

        /* VENTANA FLOTANTE LANZADOR */
        .lanzador-window { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:600px; background:white; border-radius:20px; box-shadow:0 0 50px rgba(0,0,0,0.5); z-index:15000; padding:20px; border: 4px solid var(--vip); }
        .grid-mini { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 10px; }
        .bola-s { aspect-ratio:1; background:#eee; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; cursor:pointer; font-weight:bold; border: 1px solid #ccc; }
        .bola-s.active { background: var(--accent); color: black; border-color: orange; box-shadow: 0 0 5px orange; }

        /* LOGIN Y ALERTAS */
        #loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:20000; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white; }
        #overlayBingo { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(211,47,47,0.95); z-index:30000; flex-direction:column; justify-content:center; align-items:center; color:white; text-align: center; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--accent);"></i>
        <h2>Panel Administrativo</h2>
        <input type="password" id="passMaster" placeholder="PIN" onkeyup="verificarLogin(event)" style="padding:15px; border-radius:10px; border:none; text-align:center;">
    </div>

    <div id="overlayBingo">
        <h1 style="font-size: 4rem;">¡BINGO!</h1>
        <h2 id="ganadorNom">---</h2>
        <button class="btn" style="background:white; color:red; padding: 20px;" onclick="atenderGanador()">CONTACTAR SOCIO</button>
        <audio id="audioAlerta" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" loop></audio>
    </div>

    <div id="winLanzador" class="lanzador-window">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="lanzadorTitulo" style="margin:0; color:var(--vip);">Lanzador</h3>
            <button onclick="cerrarLanzador()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        <p style="font-size:0.8rem; margin:10px 0;">Marca los números cantados para esta sala:</p>
        <div id="gridLanzador" class="grid-mini"></div>
        <button class="btn" style="width:100%; margin-top:15px; background:#f0f0f0;" onclick="reiniciarBolasSala()">REINICIAR SORTEO</button>
    </div>

    <div class="sidebar">
        <h2>Bingo Club</h2>
        <div id="controlesSalas"></div>
    </div>

    <div class="main">
        <div class="card">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="busqueda" placeholder="Buscar por nombre..." onkeyup="buscarSocio()" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;">
                <button class="btn" style="background:var(--primary); color:white;" onclick="document.getElementById('modalSocio').style.display='flex'">+ NUEVO SOCIO</button>
            </div>
            <table>
                <thead><tr><th>Socio</th><th>Claves</th><th>Sala</th><th>Cartones</th><th>Pago</th><th>WhatsApp</th></tr></thead>
                <tbody id="listaSocios"></tbody>
            </table>
        </div>
    </div>

    <div id="modalSocio" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:16000; justify-content:center; align-items:center;">
        <div style="background:white; padding:25px; border-radius:15px; width:350px;">
            <h3>Nuevo Registro</h3>
            <input type="text" id="n_nom" placeholder="Nombre" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
            <input type="text" id="n_tel" placeholder="Teléfono" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
            <input type="text" id="n_user" placeholder="Usuario" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
            <button class="btn btn-sync" onclick="guardarSocio()">CREAR SOCIO</button>
            <button class="btn" style="width:100%; margin-top:5px;" onclick="document.getElementById('modalSocio').style.display='none'">CERRAR</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const SALAS = [
        { id: "SALA_NORMAL", n: "NORMAL", c: "var(--accent)" },
        { id: "SALA_CARTON", n: "CARTÓN LLENO", c: "var(--success)" },
        { id: "SALA_NORMAL_VIP", n: "NORMAL VIP", c: "var(--vip)" },
        { id: "SALA_CARTON_VIP", n: "C. LLENO VIP", c: "var(--vip)" }
    ];

    window.verificarLogin = (e) => {
        if(e.key === "Enter" || !e.key) {
            if(document.getElementById('passMaster').value === "ADMIN496") {
                document.getElementById('loginOverlay').style.display = 'none';
                initApp();
            }
        }
    };

    let socios = [];
    let horarios = {};
    let salaAbierta = ""; // ID de la sala que se está cantando ahora
    let bolasSalas = {}; // Objeto para guardar bolas de cada sala por separado

    function initApp() {
        renderSalasControls();
        onSnapshot(collection(db, "socios"), s => {
            socios = []; s.forEach(d => socios.push({id: d.id, ...d.data()}));
            renderSocios(socios);
            recalcPotes();
        });
        onSnapshot(collection(db, "salas"), s => s.forEach(d => { 
            horarios[d.id] = d.data().horaInicio;
            bolasSalas[d.id] = d.data().bolas || [];
            if(salaAbierta === d.id) actualizarBolasVisuales();
        }));
        onSnapshot(collection(db, "alertas"), s => s.docChanges().forEach(c => {
            if(c.type === "added") {
                window.ganadorData = { ...c.doc.data(), idDoc: c.doc.id };
                document.getElementById('ganadorNom').innerText = window.ganadorData.nombre;
                document.getElementById('overlayBingo').style.display = 'flex';
                document.getElementById('audioAlerta').play().catch(()=>{});
            }
        }));
    }

    function renderSalasControls() {
        const div = document.getElementById('controlesSalas');
        div.innerHTML = SALAS.map(s => `
            <div class="sala-box" style="border-left: 5px solid ${s.c}">
                <h4 style="margin:0">${s.n}</h4>
                <div class="timer" id="t_${s.id}">--:--:--</div>
                <input type="number" id="p_${s.id}" value="100" class="btn" style="width:100%; margin:5px 0; background:white;" onchange="recalcPotes()">
                <input type="datetime-local" id="h_${s.id}" class="btn" style="width:100%; background:white;">
                <div id="d_${s.id}" style="font-size:0.8rem; font-weight:bold; margin-bottom:5px;"></div>
                <button class="btn btn-sync" onclick="sync('${s.id}')">SINCRONIZAR</button>
                <button class="btn btn-lanzador" onclick="abrirLanzador('${s.id}','${s.n}')"><i class="fas fa-play"></i> ABRIR LANZADOR</button>
            </div>
        `).join('');
    }

    window.abrirLanzador = (id, nombre) => {
        salaAbierta = id;
        document.getElementById('lanzadorTitulo').innerText = "Lanzador: " + nombre;
        const grid = document.getElementById('gridLanzador');
        grid.innerHTML = "";
        for(let i=1; i<=75; i++) {
            const b = document.createElement('div');
            b.className = "bola-s";
            b.id = `bs_${i}`;
            b.innerText = i;
            b.onclick = () => toggleBolaSala(i);
            grid.appendChild(b);
        }
        actualizarBolasVisuales();
        document.getElementById('winLanzador').style.display = 'block';
    };

    window.cerrarLanzador = () => { document.getElementById('winLanzador').style.display = 'none'; salaAbierta = ""; };

    async function toggleBolaSala(n) {
        let actual = bolasSalas[salaAbierta] || [];
        if(actual.includes(n)) actual = actual.filter(x => x !== n);
        else actual.push(n);
        await updateDoc(doc(db, "salas", salaAbierta), { bolas: actual });
    }

    function actualizarBolasVisuales() {
        const actual = bolasSalas[salaAbierta] || [];
        for(let i=1; i<=75; i++) {
            const el = document.getElementById(`bs_${i}`);
            if(el) {
                if(actual.includes(i)) el.classList.add('active');
                else el.classList.remove('active');
            }
        }
    }

    window.reiniciarBolasSala = async () => {
        if(confirm("¿Limpiar bolas de esta sala?")) await updateDoc(doc(db, "salas", salaAbierta), { bolas: [] });
    };

    function renderSocios(lista) {
        document.getElementById('listaSocios').innerHTML = lista.map(s => `
            <tr>
                <td><b>${s.nombre}</b><br><small>${s.telefono}</small></td>
                <td>U: ${s.usuario}<br>P: ${s.password}</td>
                <td><select onchange="updS('${s.id}',{idSala:this.value})">
                    ${SALAS.map(sala => `<option value="${sala.id}" ${s.idSala==sala.id?'selected':''}>${sala.n}</option>`).join('')}
                </select></td>
                <td><input type="number" value="${s.cartones || 1}" style="width:40px" onchange="updS('${s.id}',{cartones:parseInt(this.value)})"></td>
                <td><button onclick="updS('${s.id}',{activo:${!s.activo}})" class="btn ${s.activo?'btn-sync':''}">${s.activo?'PAGADO':'PENDIENTE'}</button></td>
                <td><button class="btn" style="background:#e3f2fd; color:#1976d2;" onclick="copyW('${s.nombre}','${s.usuario}','${s.password}')">Link</button></td>
            </tr>
        `).join('');
    }

    window.recalcPotes = () => {
        SALAS.forEach(async s => {
            const p = parseFloat(document.getElementById('p_'+s.id).value) || 0;
            const c = socios.filter(x => x.activo && x.idSala === s.id).reduce((a,b)=>a+(b.cartones||1),0);
            const total = p + (p * 0.04 * c);
            document.getElementById('d_'+s.id).innerText = "Pote: Bs. " + total.toFixed(2);
            await setDoc(doc(db, "salas", s.id), { premioBs: total.toFixed(2), cartonesJugando: c }, {merge:true});
        });
    };

    window.sync = async (id) => {
        const h = document.getElementById('h_'+id).value;
        await updateDoc(doc(db, "salas", id), { horaInicio: h });
        alert("Sincronizado");
    };

    window.updS = async (id, data) => await updateDoc(doc(db, "socios", id), data);

    window.buscarSocio = () => {
        const t = document.getElementById('busqueda').value.toLowerCase();
        renderSocios(socios.filter(s => s.nombre.toLowerCase().includes(t)));
    };

    window.guardarSocio = async () => {
        const n = document.getElementById('n_nom').value, t = document.getElementById('n_tel').value, u = document.getElementById('n_user').value;
        await addDoc(collection(db, "socios"), { nombre: n, telefono: t, usuario: u, password: Math.random().toString(36).substring(2,6).toUpperCase(), activo:false, cartones:1, idSala:'SALA_NORMAL' });
        document.getElementById('modalSocio').style.display='none';
    };

    window.copyW = (nom, user, pass) => {
        const msg = `*¡Hola ${nom}!* 🏆\n👤 *Usuario:* ${user}\n🔑 *Clave:* ${pass}\n🔗 https://bingoclub496-creator.github.io/CLUB_BINGO/`;
        navigator.clipboard.writeText(msg).then(()=>alert("Copiado"));
    };

    window.atenderGanador = async () => {
        window.open(`https://wa.me/${window.ganadorData.telefono.replace(/\D/g,'')}?text=Bingo!`, '_blank');
        document.getElementById('overlayBingo').style.display='none';
        document.getElementById('audioAlerta').pause();
        await deleteDoc(doc(db, "alertas", window.ganadorData.idDoc));
    };

    setInterval(() => {
        SALAS.forEach(s => {
            const el = document.getElementById('t_'+s.id);
            if(!horarios[s.id] || !el) return;
            const diff = new Date(horarios[s.id]) - new Date();
            if(diff <= 0) { el.innerText = "¡EN JUEGO!"; el.style.color = "var(--success)"; return; }
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s_ = Math.floor((diff%60000)/1000);
            el.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s_.toString().padStart(2,'0')}`;
        });
    }, 1000);
</script>
</body>
</html>

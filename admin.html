<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Panel de Mando</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #004d61; --secondary: #00796b; --danger: #d32f2f; --success: #2e7d32; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        
        /* Sidebar de Salas */
        .sidebar { width: 300px; background: var(--primary); color: white; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .room-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; border-left: 5px solid gold; }
        
        /* Contenedor Principal */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* Tabla de Socios */
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: var(--primary); }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        /* Controles de Estado */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .active { background: #e8f5e9; color: var(--success); }
        .inactive { background: #ffebee; color: var(--danger); }
        
        select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
        .btn-action { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-toggle { background: #eee; color: #333; }
        .btn-toggle.off { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-tower-control-panel"></i> Bingo Club</h2>
        
        <div class="room-card">
            <h3>Sala Normal</h3>
            <p>Pote: <input type="number" id="poteNormal" value="100" style="width: 60px;"> Bs.</p>
            <button class="btn-action" style="background:gold; color:black; width:100%">CANTAR BOLA</button>
        </div>

        <div class="room-card" style="border-color: #25D366;">
            <h3>Cartón Lleno</h3>
            <p>Pote: <input type="number" id="poteCarton" value="500" style="width: 60px;"> Bs.</p>
            <button class="btn-action" style="background:#25D366; color:white; width:100%">CANTAR BOLA</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Gestión de Socios Activos</h2>
                <button class="btn-action" style="background:var(--primary); color:white;">+ Nuevo Socio</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Socio</th>
                        <th>Sala Asignada</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaSocios">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESCUCHA EN TIEMPO REAL: Ver a los socios y sus cambios
        onSnapshot(collection(db, "socios"), (snapshot) => {
            const tabla = document.getElementById('listaSocios');
            tabla.innerHTML = '';

            snapshot.forEach((sDoc) => {
                const socio = sDoc.data();
                const id = sDoc.id;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${socio.usuario}</strong><br><small>${socio.nombre || 'Sin nombre'}</small></td>
                    <td>
                        <select onchange="cambiarSala('${id}', this.value)">
                            <option value="normal" ${socio.idSala === 'normal' ? 'selected' : ''}>Sala Normal</option>
                            <option value="carton_lleno" ${socio.idSala === 'carton_lleno' ? 'selected' : ''}>Cartón Lleno</option>
                        </select>
                    </td>
                    <td>
                        <span class="status-badge ${socio.activo ? 'active' : 'inactive'}">
                            ${socio.activo ? 'ACTIVO' : 'DESACTIVADO'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-action btn-toggle ${!socio.activo ? 'off' : ''}" 
                                onclick="toggleSocio('${id}', ${socio.activo})">
                            <i class="fas fa-power-off"></i>
                        </button>
                    </td>
                `;
                tabla.appendChild(tr);
            });
        });

        // FUNCIONES DE CONTROL (Globales para el panel)
        window.cambiarSala = async (id, nuevaSala) => {
            await updateDoc(doc(db, "socios", id), { idSala: nuevaSala });
        };

        window.toggleSocio = async (id, estadoActual) => {
            await updateDoc(doc(db, "socios", id), { activo: !estadoActual });
        };
    </script>
</body>
</html>

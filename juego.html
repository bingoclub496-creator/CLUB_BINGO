<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - En Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #004d61; color: white; text-align: center; margin: 0; padding: 10px; }
        
        /* CABECERA */
        .header-sala { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #25D366; }
        
        /* BOLA ACTUAL GIGANTE */
        .bola-viva { width: 100px; height: 100px; background: white; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; border: 6px solid #ffc107; margin: 10px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        
        /* HISTORIAL DE ÚLTIMAS 5 */
        .mini-historial { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; height: 45px; }
        .bola-prev { width: 35px; height: 35px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); color: #ffc107; }

        /* CARTÓN */
        .carton-area { background: #ccc; padding: 10px; border-radius: 15px; border: 4px solid #888; max-width: 350px; margin: auto; }
        .grid-numeros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .celda { aspect-ratio: 1; background: white; color: #222; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; border-radius: 6px; cursor: pointer; border-bottom: 4px solid #999; }
        .celda.marcada { background: #25D366 !important; color: white !important; border: none; transform: scale(0.96); }
        .celda.free { background: #ffc107; font-size: 0.6rem; color: #000; font-weight: 900; }

        .btn-bingo { width: 100%; max-width: 350px; padding: 18px; margin-top: 20px; background: #ff5252; color: white; border: none; border-radius: 40px; font-size: 1.8rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #a31010; }
    </style>
</head>
<body>

    <div class="header-sala">
        <h3 id="nomSala" style="margin:0; color:#ffc107;">CONECTANDO...</h3>
        <div style="font-size: 1.5rem; font-weight: 900;">Pote: Bs. <span id="poteSala">0.00</span></div>
    </div>

    <div class="bola-viva" id="bolaActual">--</div>

    <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">Anteriores:</div>
    <div class="mini-historial" id="historial5"></div>

    <div class="carton-area">
        <div class="grid-numeros" id="tableroCarton"></div>
    </div>

    <button class="btn-bingo" id="btnCantar">¡CANTAR BINGO!</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlP = new URLSearchParams(window.location.search);
    const idS = urlP.get('sala'), idSoc = urlP.get('socio'), cod = urlP.get('cod') || "FREE";

    let marcados = new Set(), bolasOficiales = [], tipoSala = "";

    // 1. GENERAR CARTÓN FIJO
    function seededRandom(s) { let x = Math.sin(s) * 10000; return x - Math.floor(x); }
    function dibujarCarton(codigo) {
        let seed = 0; for(let i=0; i<codigo.length; i++) seed += codigo.charCodeAt(i);
        const grid = document.getElementById('tableroCarton');
        const rangos = [[1,15],[16,30],[31,45],[46,60],[61,75]];
        let cols = [[],[],[],[],[]];

        for(let i=0; i<5; i++) {
            let pool = []; for(let n=rangos[i][0]; n<=rangos[i][1]; n++) pool.push(n);
            for(let j=0; j<5; j++) {
                let idx = Math.floor(seededRandom(seed + i + j) * pool.length);
                cols[i].push(pool.splice(idx, 1)[0]);
            }
        }

        for(let f=0; f<5; f++) {
            for(let c=0; c<5; c++) {
                const div = document.createElement('div');
                if(f===2 && c===2) {
                    div.className = 'celda free marcada'; div.innerText = "BINGO";
                    marcados.add("FREE");
                } else {
                    const n = cols[c][f];
                    div.className = 'celda'; div.innerText = n;
                    div.onclick = () => {
                        div.classList.toggle('marcada');
                        marcados.has(n) ? marcados.delete(n) : marcados.add(n);
                    };
                }
                grid.appendChild(div);
            }
        }
    }

    // 2. ESCUCHA ACTIVA DE LA SALA (Sincronización Total)
    if(idS) {
        onSnapshot(doc(db, "salas", idS), (snap) => {
            if(snap.exists()) {
                const data = snap.data();
                document.getElementById('nomSala').innerText = data.nombre;
                document.getElementById('poteSala').innerText = data.premioBs;
                document.getElementById('bolaActual').innerText = data.ultimaBola || "--";
                bolasOficiales = data.bolas || [];
                tipoSala = data.tipo;

                // Actualizar historial de las últimas 5 (excluyendo la actual)
                const histDiv = document.getElementById('historial5');
                const ultimas5 = bolasOficiales.slice(-6, -1).reverse(); // Toma las 5 anteriores a la última
                histDiv.innerHTML = ultimas5.map(b => `<div class="bola-prev">${b}</div>`).join('');
            } else {
                document.getElementById('nomSala').innerText = "SALA NO ENCONTRADA";
            }
        }, (error) => {
            console.error("Error en tiempo real:", error);
        });
    }

    // 3. BOTÓN CANTAR
    document.getElementById('btnCantar').onclick = async () => {
        const aciertos = [...marcados].filter(n => n === "FREE" || bolasOficiales.includes(n));
        let gano = (tipoSala === "Cartón Lleno") ? (aciertos.length === 25) : (aciertos.length >= 6);
        
        if(gano) {
            await updateDoc(doc(db, "socios", idSoc), { cantoBingo: true });
            alert("¡BINGO ENVIADO! Espera revisión.");
        } else {
            alert("¡Todavía no tienes los números!");
        }
    };

    dibujarCarton(cod);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Mi Cartón</title>
    <style>
        body { font-family: sans-serif; background: #004d61; color: white; text-align: center; padding: 10px; }
        .pote { font-size: 2rem; color: #25D366; font-weight: 900; margin: 10px 0; }
        .bola-actual { width: 80px; height: 80px; background: white; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; margin: 15px auto; border: 5px solid #25D366; }
        .carton { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 350px; margin: auto; background: #ddd; padding: 10px; border-radius: 10px; }
        .celda { aspect-ratio: 1; background: white; color: #333; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
        .celda.marcada { background: #25D366; color: white; }
        .btn-bingo { width: 100%; max-width: 350px; padding: 20px; margin-top: 20px; background: #ff5252; color: white; border: none; border-radius: 10px; font-size: 1.5rem; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <h2 id="sNom">Cargando...</h2>
    <div class="pote">Bs. <span id="sPot">0.00</span></div>
    <div class="bola-actual" id="sBol">--</div>
    <div class="carton" id="sCar"></div>
    <button class="btn-bingo" onclick="validarBingo()">¡CANTAR BINGO!</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", authDomain: "bingo-club-6f019.firebaseapp.com", projectId: "bingo-club-6f019", storageBucket: "bingo-club-6f019.firebasestorage.app", messagingSenderId: "1059179173812", appId: "1:1059179173812:web:78b43eaac565d213bec4e1" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlP = new URLSearchParams(window.location.search);
    const idSala = urlP.get('sala');
    const idSocio = urlP.get('socio');

    let misNum = [];
    let marcados = new Set();
    let bolasOficiales = [];
    let tipoSala = "";

    // Generar Cartón
    const sCar = document.getElementById('sCar');
    while(misNum.length < 15) { 
        let n = Math.floor(Math.random()*75)+1; 
        if(!misNum.includes(n)) misNum.push(n); 
    }
    misNum.sort((a,b)=>a-b).forEach(n => {
        const d = document.createElement('div');
        d.className = 'celda'; d.innerText = n;
        d.onclick = () => { d.classList.toggle('marcada'); marcados.has(n) ? marcados.delete(n) : marcados.add(n); };
        sCar.appendChild(d);
    });

    onSnapshot(doc(db, "salas", idSala), (snap) => {
        const data = snap.data();
        document.getElementById('sNom').innerText = data.nombre;
        document.getElementById('sPot').innerText = data.premioBs;
        document.getElementById('sBol').innerText = data.ultimaBola;
        bolasOficiales = data.bolas || [];
        tipoSala = data.tipo;
    });

    window.validarBingo = async () => {
        // Filtrar números marcados que SI han salido en la tómbola
        const validos = [...marcados].filter(n => bolasOficiales.includes(n));
        
        let gana = false;
        if(tipoSala === "Cartón Lleno" && validos.length === 15) gana = true;
        if(tipoSala === "Normal" && validos.length >= 5) gana = true;

        if(gana) {
            await updateDoc(doc(db, "socios", idSocio), { cantoBingo: true });
            alert("¡Bingo enviado! Espera validación.");
        } else {
            alert("¡BINGO FALSO! Revisa tus números marcados.");
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Vegas Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #d4af37; 
            --vegas-green: #003d2b; 
            --win-red: #b22222;
        }
        
        body, html { 
            margin: 0; padding: 0; min-height: 100vh; 
            font-family: 'Georgia', serif; 
            /* FONTO ESTILO CASINO LAS VEGAS */
            background: radial-gradient(circle, #1a472a 0%, #002211 100%), url('https://www.transparenttextures.com/patterns/poker-table.png');
            background-blend-mode: multiply;
            color: white; 
            display: flex; flex-direction: column; align-items: center;
        }

        /* HEADER ESTILO MARQUESINA */
        .header-vegas {
            width: 100%; background: rgba(0,0,0,0.8);
            border-bottom: 3px solid var(--gold);
            padding: 15px 0; text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .info-panel {
            display: grid; grid-template-columns: 1fr 1.5fr 1fr;
            gap: 10px; width: 95%; max-width: 800px; margin: 20px auto;
        }

        /* CUADROS DE TEXTO PROFESIONALES (Corrección 3 y 4) */
        .data-box {
            background: linear-gradient(145deg, #222, #000);
            border: 2px solid var(--gold); border-radius: 10px;
            padding: 10px; text-align: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .data-box label { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        .data-box span { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .pote-destacado { color: #25D366 !important; font-size: 1.4rem !important; }

        /* PANEL DE ÚLTIMA BOLA */
        .ball-display {
            width: 120px; height: 120px; background: white; 
            border-radius: 50%; border: 5px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; color: #111; font-weight: 900;
            box-shadow: 0 0 30px rgba(255,255,255,0.2), inset 0 0 20px rgba(0,0,0,0.2);
            margin: 0 auto;
        }

        /* CONTENEDOR DE CARTONES (Corrección 1) */
        #misCartones { 
            display: flex; flex-direction: column; gap: 30px; 
            width: 100%; align-items: center; padding-bottom: 100px;
        }
        
        .carton-vegas {
            background: #fdfdfd; border-radius: 15px; padding: 10px;
            width: 90%; max-width: 380px;
            border: 8px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .grid-bingo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #333; border: 2px solid #333; }
        .celda { 
            aspect-ratio: 1; background: white; color: #222;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        /* MARCADO PROFESIONAL */
        .celda.marcada { 
            background: var(--win-red) !important; 
            color: white !important; 
            position: relative;
        }
        .celda.marcada::after {
            content: ""; position: absolute; width: 80%; height: 80%;
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
        }
        .celda-header { background: var(--gold); color: black; font-weight: 900; height: 40px; }

        .btn-bingo {
            position: fixed; bottom: 20px; width: 80%; max-width: 300px;
            padding: 20px; background: var(--win-red); color: white;
            border: 3px solid var(--gold); border-radius: 50px;
            font-size: 1.8rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="header-vegas">
        <img src="logo.png" height="50" onerror="this.style.display='none'">
        <div style="color: var(--gold); font-size: 0.8rem; margin-top: 5px;">Socio: <span id="nombreJugador">...</span></div>
    </div>

    <div class="info-panel">
        <div class="data-box">
            <label>Sorteo</label>
            <span id="nombreSalaTxt">---</span><br>
            <small id="tipoSalaTxt" style="color:var(--gold); font-size:0.6rem">MODO: --</small>
        </div>
        
        <div class="ball-display" id="bolaActual">--</div>

        <div class="data-box">
            <label>Gran Pote</label>
            <span class="pote-destacado" id="poteTxt">Bs. 0</span>
        </div>
    </div>

    <div id="misCartones">
        <h2 style="color: var(--gold)">GENERANDO CARTONES...</h2>
    </div>

    <button class="btn-bingo" onclick="cantarBingo()">¡BINGO!</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sesion = JSON.parse(sessionStorage.getItem('socioActual'));
        if(!sesion) window.location.href = 'index.html';

        document.getElementById('nombreJugador').innerText = sesion.nombre;
        let misCartones = [];
        let salaData = null;

        // ESCUCHAR SALA Y ACTUALIZAR DATOS (Correcciones 3 y 4)
        onSnapshot(doc(db, "salas", sesion.idSala), (snap) => {
            if(!snap.exists()) return;
            salaData = snap.data();
            
            document.getElementById('nombreSalaTxt').innerText = salaData.nombre;
            document.getElementById('tipoSalaTxt').innerText = salaData.tipo === 'cartonLleno' ? 'CARTÓN LLENO' : 'MODO NORMAL';
            document.getElementById('poteTxt').innerText = `Bs. ${salaData.premioBs}`;
            
            const bolas = salaData.bolas || [];
            if(bolas.length > 0) {
                document.getElementById('bolaActual').innerText = bolas[bolas.length - 1];
            }

            if(misCartones.length === 0) iniciarJuego();
        });

        function iniciarJuego() {
            const container = document.getElementById('misCartones');
            container.innerHTML = "";
            for(let i=0; i < sesion.cantCartones; i++) {
                renderizarCarton(i);
            }
        }

        // GENERACIÓN DE CARTÓN PROFESIONAL
        function renderizarCarton(index) {
            const div = document.createElement('div');
            div.className = 'carton-vegas';
            div.innerHTML = `
                <div class="grid-bingo">
                    <div class="celda celda-header">B</div>
                    <div class="celda celda-header">I</div>
                    <div class="celda celda-header">N</div>
                    <div class="celda celda-header">G</div>
                    <div class="celda celda-header">O</div>
                </div>
                <div class="grid-bingo" id="c-${index}"></div>
            `;
            document.getElementById('misCartones').appendChild(div);
            
            const grid = document.getElementById(`c-${index}`);
            const rangos = { B:[1,15], I:[16,30], N:[31,45], G:[46,60], O:[61,75] };
            const numerosCarton = {};

            ['B','I','N','G','O'].forEach(letra => {
                numerosCarton[letra] = [];
                while(numerosCarton[letra].length < 5) {
                    let num = Math.floor(Math.random() * (rangos[letra][1] - rangos[letra][0] + 1)) + rangos[letra][0];
                    if(!numerosCarton[letra].includes(num)) numerosCarton[letra].push(num);
                }
                numerosCarton[letra].sort((a,b) => a-b);
            });

            // Llenar el grid por filas para que sea visualmente correcto
            for(let f=0; f<5; f++) {
                ['B','I','N','G','O'].forEach(letra => {
                    const celda = document.createElement('div');
                    celda.className = 'celda';
                    let valor = numerosCarton[letra][f];
                    
                    if(letra === 'N' && f === 2) {
                        celda.innerText = "CLUB";
                        celda.classList.add('marcada');
                        celda.style.fontSize = '0.6rem';
                    } else {
                        celda.innerText = valor;
                        celda.onclick = () => celda.classList.toggle('marcada');
                    }
                    grid.appendChild(celda);
                });
            }
        }

        window.cantarBingo = () => {
            alert("¡REVISANDO CARTONES! Espera que el administrador valide tu jugada.");
            // Aquí iría la lógica de verificación contra salaData.bolas
        };
    </script>
</body>
</html>

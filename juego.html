<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Juego en Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #004d61; color: white; text-align: center; margin: 0; padding: 10px; }
        .header-sala { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #25D366; }
        
        /* BOLA GIGANTE */
        .bola-viva { width: 90px; height: 90px; background: white; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; border: 6px solid #ffc107; margin: 10px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.5); position: relative; }
        
        /* TABLERO GENERAL (Fichas cantadas) */
        .tablero-general { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .ficha-guia { aspect-ratio: 1; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 3px; color: rgba(255,255,255,0.3); }
        .ficha-guia.cantada { background: #ffc107; color: #000; font-weight: bold; box-shadow: 0 0 5px #ffc107; }

        /* CARTÓN LAS VEGAS */
        .carton-area { background: #ccc; padding: 10px; border-radius: 15px; border: 4px solid #888; max-width: 350px; margin: auto; }
        .grid-numeros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .celda { aspect-ratio: 1; background: white; color: #222; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; border-radius: 6px; cursor: pointer; border-bottom: 4px solid #999; }
        .celda.marcada { background: #25D366 !important; color: white !important; border: none; transform: scale(0.96); }
        .celda.free { background: #ffc107; font-size: 0.6rem; color: #000; font-weight: 900; }

        .btn-bingo { width: 100%; max-width: 350px; padding: 18px; margin-top: 15px; background: #ff5252; color: white; border: none; border-radius: 40px; font-size: 1.8rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #a31010; }
    </style>
</head>
<body>

    <div class="header-sala">
        <h3 id="nomSala" style="margin:0; color:#ffc107;">CONECTANDO...</h3>
        <div style="font-size: 1.8rem; font-weight: 900;">Bs. <span id="poteSala">0.00</span></div>
    </div>

    <div class="bola-viva" id="bolaActual">--</div>

    <div style="font-size: 0.7rem; margin-bottom: 5px; color: #aaa;">TABLERO DE CONTROL</div>
    <div class="tablero-general" id="tableroFichas"></div>

    <div class="carton-area">
        <div class="grid-numeros" id="tableroCarton"></div>
    </div>

    <button class="btn-bingo" id="btnCantarBingo">¡BINGO!</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlP = new URLSearchParams(window.location.search);
    const idS = urlP.get('sala'), idSoc = urlP.get('socio'), cod = urlP.get('cod') || "DEMO";

    let marcados = new Set(), bolasOficiales = [], tipoSala = "";

    // 1. DIBUJAR TABLERO DE CONTROL (1-75)
    function crearTableroControl() {
        const t = document.getElementById('tableroFichas');
        for(let i=1; i<=75; i++) {
            const ficha = document.createElement('div');
            ficha.className = 'ficha-guia';
            ficha.id = `f-${i}`;
            ficha.innerText = i;
            t.appendChild(ficha);
        }
    }

    // 2. GENERAR CARTÓN FIJO (SEMILLA)
    function seededRandom(s) { let x = Math.sin(s) * 10000; return x - Math.floor(x); }
    function generarCarton(codigo) {
        let seed = 0; for(let i=0; i<codigo.length; i++) seed += codigo.charCodeAt(i);
        const grid = document.getElementById('tableroCarton');
        const rangos = [[1,15],[16,30],[31,45],[46,60],[61,75]];
        let cols = [[],[],[],[],[]];

        for(let i=0; i<5; i++) {
            let pool = []; for(let n=rangos[i][0]; n<=rangos[i][1]; n++) pool.push(n);
            for(let j=0; j<5; j++) {
                let idx = Math.floor(seededRandom(seed + i + j) * pool.length);
                cols[i].push(pool.splice(idx, 1)[0]);
            }
        }

        for(let f=0; f<5; f++) {
            for(let c=0; c<5; c++) {
                const div = document.createElement('div');
                if(f===2 && c===2) {
                    div.className = 'celda free marcada'; div.innerText = "BINGO";
                    marcados.add("FREE");
                } else {
                    const n = cols[c][f];
                    div.className = 'celda'; div.innerText = n;
                    div.onclick = () => {
                        div.classList.toggle('marcada');
                        marcados.has(n) ? marcados.delete(n) : marcados.add(n);
                    };
                }
                grid.appendChild(div);
            }
        }
    }

    // 3. SINCRONIZACIÓN EN TIEMPO REAL
    if(idS) {
        onSnapshot(doc(db, "salas", idS), (snap) => {
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('nomSala').innerText = d.nombre;
                document.getElementById('poteSala').innerText = d.premioBs;
                document.getElementById('bolaActual').innerText = d.ultimaBola || "--";
                bolasOficiales = d.bolas || [];
                tipoSala = d.tipo;

                // Actualizar Tablero de Control (Fichas cantadas)
                document.querySelectorAll('.ficha-guia').forEach(f => f.classList.remove('cantada'));
                bolasOficiales.forEach(num => {
                    const f = document.getElementById(`f-${num}`);
                    if(f) f.classList.add('cantada');
                });
            }
        });
    }

    // 4. BOTÓN BINGO
    document.getElementById('btnCantarBingo').onclick = async () => {
        const aciertos = [...marcados].filter(n => n === "FREE" || bolasOficiales.includes(n));
        let gano = (tipoSala === "Cartón Lleno") ? (aciertos.length === 25) : (aciertos.length >= 6);
        
        if(gano) {
            await updateDoc(doc(db, "socios", idSoc), { cantoBingo: true });
            alert("¡BINGO CANTADO! Validando fichas...");
        } else {
            alert("Fichas incompletas. Verifica tu cartón.");
        }
    };

    crearTableroControl();
    generarCarton(cod);
</script>
</body>
</html>

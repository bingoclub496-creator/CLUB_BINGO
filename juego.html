<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Luxury Vegas Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --vegas-gold: #b8860b;
            --vegas-bg: #0a0e17;
            --vegas-panel: #161b29;
            --vegas-accent: #ffc107;
            --vegas-text: #e0e0e0;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-vegas: 'Arial Black', Gadget, sans-serif;
        }

        body {
            margin: 0; padding: 0; font-family: var(--font-main);
            background: var(--vegas-bg) url('https://www.transparenttextures.com/patterns/dark-dot-pixel.png');
            color: var(--vegas-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- DISPLAY DE BOLAS --- */
        .ball-display-pnl {
            background: var(--vegas-panel); padding: 15px; border-bottom: 3px solid var(--vegas-gold);
            display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 100;
        }

        .current-ball-wrapper { position: relative; width: 100px; height: 100px; }
        .current-ball-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #eee 40%, #ccc 80%, #aaa 100%);
            border-radius: 50%; box-shadow: 0 0 25px var(--vegas-accent); border: 4px solid var(--vegas-accent);
        }

        .current-ball-num {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: var(--font-vegas); font-size: 3.5rem; color: #000;
        }

        .recent-balls-pnl { display: flex; flex-direction: column; gap: 8px; }
        .recent-balls-label { font-size: 0.75rem; color: var(--vegas-accent); text-transform: uppercase; font-weight: bold; }
        .recent-balls-list { display: flex; gap: 8px; }

        .mini-ball {
            width: 35px; height: 35px; background: rgba(255,255,255,0.8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-vegas); font-size: 1.1rem; color: #111; border: 2px solid #999;
            opacity: 0.5; transition: 0.3s;
        }
        .mini-ball.active { opacity: 1; border-color: #fff; box-shadow: 0 0 5px #fff; }

        /* --- INFO BAR --- */
        .info-bar {
            background: rgba(0,0,0,0.5); padding: 8px 15px; display: flex;
            justify-content: space-between; align-items: center; font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* --- CARTONES --- */
        .main-content {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; align-items: center; gap: 25px; padding-bottom: 120px;
        }

        .bingo-card {
            background: #fff; color: #000; border-radius: 15px; width: 100%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 6px solid var(--vegas-gold); overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #8b0000 0%, #b22222 100%); color: white;
            padding: 10px; text-align: center; font-family: var(--font-vegas); font-size: 1.2rem;
            border-bottom: 3px solid var(--vegas-gold);
        }

        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px; background: #f0f0f0; }
        .card-cell {
            aspect-ratio: 1; background: #fff; border: 1px solid #ccc; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-vegas); font-size: 1.6rem; color: #111; cursor: pointer; position: relative;
        }

        .card-cell.marked::after {
            content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
            background: rgba(139, 0, 0, 0.85); border-radius: 50%; animation: stampBall 0.2s ease-out;
        }
        
        .card-cell.marked span { color: white; z-index: 1; }
        .card-cell.free-space { background: #ffc107; color: #8b0000; font-size: 0.7rem; font-weight: bold; }

        @keyframes stampBall { from { transform: scale(2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- BOTONES Y CHAT --- */
        .btn-bingo-wrapper { position: fixed; bottom: 80px; right: 20px; z-index: 150; }
        .btn-bingo {
            background: linear-gradient(135deg, #d32f2f 0%, #9a0000 100%); color: white;
            border: 4px solid var(--vegas-accent); border-radius: 50px; padding: 15px 30px;
            font-family: var(--font-vegas); font-size: 1.2rem; cursor: pointer;
            animation: pulseBingo 1.5s infinite;
        }

        @keyframes pulseBingo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #chatMsgs {
            position: fixed; bottom: 75px; left: 10px; width: 65%; height: 140px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 5px; pointer-events: none;
        }
        .msg { background: rgba(0,0,0,0.8); color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 0.85rem; max-width: 85%; }
        .msg.self { background: rgba(184, 134, 11, 0.9); align-self: flex-end; }

        .chat-input-area {
            position: fixed; bottom: 0; width: 100%; background: var(--vegas-panel);
            padding: 12px; display: flex; gap: 10px; box-sizing: border-box; border-top: 2px solid var(--vegas-gold);
        }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #000; color: #fff; }
    </style>
</head>
<body>

    <div class="ball-display-pnl">
        <div class="current-ball-wrapper">
            <div class="current-ball-bg"></div>
            <div class="current-ball-num" id="currentBallNum">--</div>
        </div>
        <div class="recent-balls-pnl">
            <div class="recent-balls-label">Últimas 5</div>
            <div class="recent-balls-list" id="miniContainer">
                <div class="mini-ball">--</div><div class="mini-ball">--</div><div class="mini-ball">--</div><div class="mini-ball">--</div><div class="mini-ball">--</div>
            </div>
        </div>
    </div>

    <div class="info-bar">
        <div id="relojSala" style="color:var(--vegas-accent); font-weight:bold;">00:00:00</div>
        <div id="poteSala" style="color:#25D366; font-weight:bold;">Bs. 0.00</div>
    </div>

    <div class="main-content" id="contenedorCartones">
        <h3 style="color:#666; margin-top:50px;">Conectando al Club...</h3>
    </div>

    <div class="btn-bingo-wrapper">
        <button class="btn-bingo" onclick="window.cantarBingo()">¡BINGO!</button>
    </div>

    <div id="chatMsgs"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Escribe al grupo...">
        <button onclick="window.enviarChat()" style="background:var(--vegas-gold); border:none; border-radius:50%; width:45px; height:45px;"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
            authDomain: "bingo-club-6f019.firebaseapp.com", 
            projectId: "bingo-club-6f019", 
            storageBucket: "bingo-club-6f019.firebasestorage.app", 
            messagingSenderId: "1059179173812", 
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const socio = JSON.parse(sessionStorage.getItem('socioLogueado'));
        if(!socio) window.location.href = 'index.html';

        let currentSemilla = null;

        // --- GUARDIÁN Y CAMBIO DE CARTONES (Semilla) ---
        onSnapshot(doc(db, "socios", socio.id), (snap) => {
            const d = snap.data();
            if(!snap.exists() || d.activo !== true) {
                sessionStorage.clear(); window.location.href = 'index.html';
            } else if (d.semilla !== currentSemilla) {
                currentSemilla = d.semilla;
                renderizarCartones(d.semilla, d.cartones || 1);
            }
        });

        function renderizarCartones(semilla, cantidad) {
            const contenedor = document.getElementById('contenedorCartones');
            contenedor.innerHTML = "";
            for(let c=0; c<cantidad; c++) {
                const nums = generarNumeros(semilla, c);
                const card = document.createElement('div');
                card.className = 'bingo-card';
                card.innerHTML = `<div class="card-header">CARTÓN ${c+1}</div>`;
                const grid = document.createElement('div');
                grid.className = 'card-grid';

                for(let f=0; f<5; f++) {
                    for(let col=0; col<5; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'card-cell';
                        if(f===2 && col===2) { cell.classList.add('free-space'); cell.innerText = "CLUB"; }
                        else {
                            cell.innerHTML = `<span>${nums[col][f]}</span>`;
                            cell.onclick = () => cell.classList.toggle('marked');
                        }
                        grid.appendChild(cell);
                    }
                }
                card.appendChild(grid); contenedor.appendChild(card);
            }
        }

        function generarNumeros(semilla, numC) {
            const s = (semilla || 0) + numC;
            const rangos = [[1,15],[16,30],[31,45],[46,60],[61,75]];
            return rangos.map((r, i) => {
                let col = [];
                let iter = 0;
                while(col.length < 5) {
                    let x = Math.sin(s + iter + i) * 10000;
                    let n = Math.floor((x - Math.floor(x)) * (r[1]-r[0]+1)) + r[0];
                    if(!col.includes(n)) col.push(n);
                    iter++;
                }
                return col.sort((a,b)=>a-b);
            });
        }

        // --- MONITOR SALA (Bolas y Tiempo) ---
        onSnapshot(doc(db, "salas", socio.idSala), (snap) => {
            const data = snap.data(); if(!data) return;
            document.getElementById('poteSala').innerText = `Bs. ${data.premioBs || '0.00'}`;
            
            // Reloj Automático
            const destino = new Date(data.horaInicio).getTime();
            const itv = setInterval(() => {
                const dif = destino - new Date().getTime();
                const r = document.getElementById('relojSala');
                if(dif <= 0) { r.innerText = "¡EN VIVO!"; clearInterval(itv); }
                else {
                    const m = Math.floor((dif%(1000*60*60))/(1000*60)), s = Math.floor((dif%(1000*60))/1000);
                    r.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                }
            }, 1000);

            // Bolas Automáticas
            const b = data.bolas || [];
            if(b.length > 0) {
                document.getElementById('currentBallNum').innerText = b[b.length-1];
                const recientes = b.slice(-6, -1).reverse();
                const minis = document.getElementById('miniContainer').children;
                for(let i=0; i<5; i++) {
                    if(recientes[i]) { minis[i].innerText = recientes[i]; minis[i].classList.add('active'); }
                    else { minis[i].innerText = "--"; minis[i].classList.remove('active'); }
                }
            }
        });

        // --- CHAT Y BINGO ---
        window.enviarChat = async () => {
            const inp = document.getElementById('chatInput'); if(!inp.value.trim()) return;
            await addDoc(collection(db, "chats"), { idSala: socio.idSala, idSocio: socio.id, nombre: socio.nombre, mensaje: inp.value, time: serverTimestamp() });
            inp.value = "";
        };

        onSnapshot(query(collection(db, "chats"), where("idSala", "==", socio.idSala), orderBy("time", "desc"), limit(10)), (s) => {
            const c = document.getElementById('chatMsgs'); c.innerHTML = "";
            s.docs.reverse().forEach(d => {
                const m = d.data(); const div = document.createElement('div');
                div.className = `msg ${m.idSocio === socio.id ? 'self' : ''}`;
                div.innerHTML = m.idSocio === socio.id ? m.mensaje : `<b>${m.nombre.split(" ")[0]}:</b> ${m.mensaje}`;
                c.appendChild(div);
            });
            c.scrollTop = c.scrollHeight;
        });

        window.cantarBingo = async () => {
            if(confirm("¿Cantar BINGO?")) {
                await addDoc(collection(db, "alertas"), { idSala: socio.idSala, idSocio: socio.id, nombre: socio.nombre, time: serverTimestamp() });
                alert("¡Bingo cantado! Espera verificación.");
            }
        };
    </script>
</body>
</html>

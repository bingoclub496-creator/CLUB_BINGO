<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bingo Club - En Juego</title>
    <style>
        body { font-family: sans-serif; background: #004d61; color: white; text-align: center; }
        .info-panel { background: rgba(0,0,0,0.3); padding: 15px; margin-bottom: 20px; border-bottom: 2px solid #ffc107; }
        .timer { font-size: 2rem; color: #ffc107; font-weight: bold; }
        .bolas-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; padding: 10px; max-width: 500px; margin: auto; }
        .bola { width: 35px; height: 35px; background: #eee; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; opacity: 0.3; }
        .bola.activa { opacity: 1; background: #ffc107; transform: scale(1.1); box-shadow: 0 0 10px #ffc107; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h2 id="saludoSocio">Cargando...</h2>
        <div id="statusJuego" style="font-size: 1.2rem;">Sincronizando con el Administrador...</div>
        <div class="timer" id="cronometro">00:00:00</div>
        <div id="premioDisplay" style="margin-top: 10px; font-weight: bold; color: #25D366;">PREMIO: Bs. 0.00</div>
    </div>

    <h3>BOLAS CANTADAS</h3>
    <div id="tableroBolas" class="bolas-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* TU CONFIGURACIÓN AQUÍ */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. VALIDACIÓN DE SESIÓN INMEDIATA
        const socio = JSON.parse(sessionStorage.getItem('socioLogueado'));
        if(!socio) { window.location.href = 'index.html'; }

        document.getElementById('saludoSocio').innerText = "Hola, " + socio.nombre;

        // 2. EL GUARDIÁN: ESCUCHA SI EL ADMIN LO DESACTIVA
        onSnapshot(doc(db, "socios", socio.id), (snap) => {
            if(!snap.exists() || snap.data().activo === false) {
                alert("⛔ SESIÓN FINALIZADA POR EL ADMINISTRADOR");
                sessionStorage.clear();
                window.location.href = 'index.html';
            }
        });

        // 3. MONITOR DE SALA (TIEMPO, PREMIO Y BOLAS)
        onSnapshot(doc(db, "salas", socio.idSala), (snap) => {
            const data = snap.data();
            if(!data) return;

            // Actualizar Premio
            document.getElementById('premioDisplay').innerText = `PREMIO ACUMULADO: Bs. ${data.premioBs || '0.00'}`;

            // Manejar Cronómetro
            const horaInicio = new Date(data.horaInicio);
            actualizarReloj(horaInicio);

            // Pintar Tablero de Bolas
            renderTablero(data.bolas || []);
        });

        function renderTablero(bolasCantadas) {
            const container = document.getElementById('tableroBolas');
            container.innerHTML = "";
            for(let i=1; i<=75; i++) {
                const b = document.createElement('div');
                b.className = `bola ${bolasCantadas.includes(i) ? 'activa' : ''}`;
                b.innerText = i;
                container.appendChild(b);
            }
        }

        function actualizarReloj(inicio) {
            const t = document.getElementById('cronometro');
            const st = document.getElementById('statusJuego');
            
            setInterval(() => {
                const ahora = new Date();
                const dif = inicio - ahora;

                if (dif <= 0) {
                    t.innerText = "¡EN JUEGO!";
                    st.innerText = "El sorteo ha comenzado. ¡Buena suerte!";
                } else {
                    const h = Math.floor(dif/3600000), m = Math.floor((dif%3600000)/60000), s = Math.floor((dif%60000)/1000);
                    t.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    st.innerText = "Esperando la hora de inicio...";
                }
            }, 1000);
        }
    </script>
</body>
</html>

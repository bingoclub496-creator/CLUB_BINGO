<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Las Vegas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #004d61; color: white; text-align: center; margin: 0; padding: 10px; }
        .header-info { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px; margin-bottom: 10px; }
        .pote { font-size: 2.2rem; color: #25D366; font-weight: 900; }
        
        .bola-actual { width: 100px; height: 100px; background: white; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 900; border: 6px solid #ffc107; margin: 15px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* DISEÑO LAS VEGAS */
        .carton-wrapper { background: #dcdcdc; padding: 10px; border-radius: 15px; border: 5px solid #a0a0a0; max-width: 360px; margin: auto; }
        .grid-bingo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .letra { background: #d32f2f; color: white; font-weight: 900; font-size: 1.5rem; padding: 5px 0; border-radius: 5px; }
        .celda { aspect-ratio: 1; background: #fff; color: #333; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; border-radius: 8px; cursor: pointer; border-bottom: 4px solid #bbb; }
        .celda.marcada { background: #25D366 !important; color: white !important; border-bottom: none; transform: scale(0.95); }
        .celda.free { background: #ffc107; font-size: 0.7rem; color: #000; font-weight: 900; }

        /* HISTORIAL */
        .historial-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 15px; background: rgba(0,0,0,0.2); margin-top: 15px; border-radius: 10px; }
        .bola-h { min-width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        /* CHAT FLOTANTE */
        #chat-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; text-align: right; }
        #chat-box { display: none; background: white; width: 220px; border-radius: 15px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px; text-align: left; }
        .chat-toggle { width: 55px; height: 55px; background: #25D366; color: white; border: none; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
        .msg-btn { width: 100%; padding: 10px; margin: 3px 0; border: none; border-radius: 8px; background: #f0f0f0; cursor: pointer; font-weight: bold; color: #333; }

        .btn-bingo { width: 100%; max-width: 360px; padding: 18px; margin-top: 20px; background: #ff5252; color: white; border: none; border-radius: 50px; font-size: 1.8rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #b71c1c; }
    </style>
</head>
<body>

    <div class="header-info">
        <h2 id="txtSala" style="margin: 0;">Cargando...</h2>
        <div class="pote">Bs. <span id="txtPote">0.00</span></div>
    </div>

    <div class="bola-actual" id="txtBola">--</div>

    <div class="carton-wrapper">
        <div class="grid-bingo">
            <div class="letra">B</div><div class="letra">I</div><div class="letra">N</div><div class="letra">G</div><div class="letra">O</div>
        </div>
        <div class="grid-bingo" id="gridCeldas"></div>
    </div>

    <div class="historial-scroll" id="listaHistorial"></div>

    <button class="btn-bingo" id="btnCantar">¡CANTAR BINGO!</button>

    <div id="chat-float">
        <div id="chat-box">
            <button class="msg-btn" onclick="enviar('¡BINGO! 🏆')">¡BINGO! 🏆</button>
            <button class="msg-btn" onclick="enviar('¡Falta una! 😱')">¡Falta una! 😱</button>
            <button class="msg-btn" onclick="enviar('¡Esa era la mía! 🔥')">¡Esa era! 🔥</button>
        </div>
        <button class="chat-toggle" id="btnToggleChat"><i class="fas fa-comments"></i></button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
        authDomain: "bingo-club-6f019.firebaseapp.com", 
        projectId: "bingo-club-6f019", 
        storageBucket: "bingo-club-6f019.firebasestorage.app", 
        messagingSenderId: "1059179173812", 
        appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlP = new URLSearchParams(window.location.search);
    const idSala = urlP.get('sala'), idSocio = urlP.get('socio');

    let marcados = new Set(), bolasOficiales = [], tipoSala = "";

    // FUNCIÓN DE CHAT (Ahora dentro del módulo para que funcione)
    const chatBox = document.getElementById('chat-box');
    document.getElementById('btnToggleChat').onclick = () => {
        chatBox.style.display = (chatBox.style.display === 'block') ? 'none' : 'block';
    };
    window.enviar = (m) => { alert("Reacción: " + m); chatBox.style.display = 'none'; };

    // GENERAR CARTÓN (Aseguramos que el grid exista)
    function generar() {
        const grid = document.getElementById('gridCeldas');
        if(!grid) return;
        
        const rangos = [[1,15],[16,30],[31,45],[46,60],[61,75]];
        let cols = [[],[],[],[],[]];
        for(let i=0; i<5; i++) {
            while(cols[i].length < 5) {
                let n = Math.floor(Math.random()*(rangos[i][1]-rangos[i][0]+1)) + rangos[i][0];
                if(!cols[i].includes(n)) cols[i].push(n);
            }
        }

        for(let f=0; f<5; f++) {
            for(let c=0; c<5; c++) {
                const div = document.createElement('div');
                if(f === 2 && c === 2) {
                    div.className = 'celda free marcada'; div.innerText = "FREE";
                    marcados.add("FREE");
                } else {
                    const num = cols[c][f];
                    div.className = 'celda'; div.innerText = num;
                    div.onclick = () => {
                        div.classList.toggle('marcada');
                        marcados.has(num) ? marcados.delete(num) : marcados.add(num);
                    };
                }
                grid.appendChild(div);
            }
        }
    }

    // SINCRONIZACIÓN FIREBASE
    if(idSala) {
        onSnapshot(doc(db, "salas", idSala), (snap) => {
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('txtSala').innerText = d.nombre;
                document.getElementById('txtPote').innerText = d.premioBs;
                document.getElementById('txtBola').innerText = d.ultimaBola;
                bolasOficiales = d.bolas || [];
                tipoSala = d.tipo;
                document.getElementById('listaHistorial').innerHTML = bolasOficiales.slice().reverse().map(b => `<div class="bola-h">${b}</div>`).join('');
            }
        });
    }

    // CANTAR BINGO
    document.getElementById('btnCantar').onclick = async () => {
        const validos = [...marcados].filter(n => n === "FREE" || bolasOficiales.includes(n));
        let gano = (tipoSala === "Cartón Lleno") ? (validos.length === 25) : (validos.length >= 6);

        if(gano) {
            await updateDoc(doc(db, "socios", idSocio), { cantoBingo: true });
            alert("¡Bingo Cantado!");
        } else {
            alert("Aún no completas el patrón.");
        }
    };

    // INICIAR AL CARGAR
    window.onload = generar;
</script>
</body>
</html>

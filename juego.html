<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - En Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primario: #004d61; --secundario: #25D366; }
        body, html { margin: 0; padding: 0; min-height: 100vh; font-family: 'Arial Black', sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; color: white; }
        
        .header-juego { background: rgba(0, 77, 97, 0.8); backdrop-filter: blur(10px); padding: 15px; text-align: center; border-bottom: 2px solid var(--secundario); position: sticky; top: 0; z-index: 100; }
        
        .contenedor-principal { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* Panel de Bolas que van saliendo */
        .panel-bolas { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); border-radius: 25px; padding: 15px; width: 90%; max-width: 500px; border: 1px solid rgba(255,255,255,0.3); text-align: center; }
        .ultima-bola { font-size: 4rem; color: var(--secundario); text-shadow: 0 0 15px rgba(37, 211, 102, 0.6); margin: 10px 0; }
        .lista-bolas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; max-height: 100px; overflow-y: auto; }
        .bola-pequena { width: 35px; height: 35px; background: white; color: var(--primario); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }

        /* Estilo de los Cartones */
        .carton-contenedor { background: white; border-radius: 20px; padding: 10px; width: 100%; max-width: 350px; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid-bingo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .celda { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; font-size: 1.2rem; font-weight: bold; border-radius: 5px; cursor: pointer; position: relative; }
        .celda.marcada { background: var(--secundario); color: white; border-color: var(--secundario); }
        .celda.centro { background: #eee; font-size: 0.8rem; color: var(--primario); }

        .info-sala { font-size: 0.9rem; margin-top: 5px; color: #25D366; }
        .btn-cantar { width: 90%; max-width: 400px; padding: 20px; background: #ffc107; color: #000; border: none; border-radius: 50px; font-weight: 900; font-size: 1.5rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header-juego">
        <img src="logo.png" height="40" alt="Logo">
        <div id="nombreSocio" style="font-size: 0.8rem; opacity: 0.8;">Cargando...</div>
    </div>

    <div class="contenedor-principal">
        <div class="panel-bolas">
            <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;">Última Bola</div>
            <div id="bolaActual" class="ultima-bola">--</div>
            <div class="info-sala" id="infoTipoSala">Modalidad: Cargando...</div>
            <div class="lista-bolas" id="historialBolas"></div>
        </div>

        <button class="btn-cantar" onclick="verificarGanador()">¡BINGO!</button>

        <div id="misCartones"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. RECUPERAR SESIÓN
        const sesion = JSON.parse(sessionStorage.getItem('socioActual'));
        if(!sesion) window.location.href = 'index.html';

        document.getElementById('nombreSocio').innerText = `Socio: ${sesion.nombre} | Cartones: ${sesion.cantCartones}`;

        let salaActual = null;
        let misCartonesGenerados = [];

        // 2. ESCUCHAR LA SALA EN TIEMPO REAL
        onSnapshot(doc(db, "salas", sesion.idSala), (snap) => {
            if(!snap.exists()) return;
            salaActual = snap.data();
            
            // Actualizar interfaz
            document.getElementById('infoTipoSala').innerText = `Modalidad: ${salaActual.tipo === 'cartonLleno' ? 'CARTÓN LLENO' : 'NORMAL (LÍNEA/CRUZ)'}`;
            
            const bolas = salaActual.bolas || [];
            if(bolas.length > 0) {
                document.getElementById('bolaActual').innerText = bolas[bolas.length - 1];
                renderHistorial(bolas);
            }

            if(misCartonesGenerados.length === 0) generarCartones(sesion.cantCartones);
        });

        function renderHistorial(bolas) {
            const h = document.getElementById('historialBolas');
            h.innerHTML = "";
            bolas.reverse().forEach(b => {
                h.innerHTML += `<div class="bola-pequena">${b}</div>`;
            });
        }

        // 3. GENERADOR DE CARTONES (Lógica de Bingo real)
        function generarCartones(cantidad) {
            const contenedor = document.getElementById('misCartones');
            contenedor.innerHTML = "";
            
            for(let i=0; i<cantidad; i++) {
                const carton = crearEstructuraBingo();
                misCartonesGenerados.push(carton);
                renderCarton(carton, i);
            }
        }

        function crearEstructuraBingo() {
            let columnas = {
                'B': generarRango(1, 15, 5),
                'I': generarRango(16, 30, 5),
                'N': generarRango(31, 45, 5),
                'G': generarRango(46, 60, 5),
                'O': generarRango(61, 75, 5)
            };
            columnas['N'][2] = "FREE"; // Espacio central
            return columnas;
        }

        function generarRango(min, max, cant) {
            let nums = [];
            while(nums.length < cant) {
                let r = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!nums.includes(r)) nums.push(r);
            }
            return nums.sort((a,b) => a-b);
        }

        function renderCarton(columnas, index) {
            const div = document.createElement('div');
            div.className = 'carton-contenedor';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; color:var(--primario)">
                    <span>CARTÓN #${index + 1}</span>
                    <span style="color:#999">B I N G O</span>
                </div>
                <div class="grid-bingo" id="grid-${index}"></div>
            `;
            document.getElementById('misCartones').appendChild(div);
            
            const grid = document.getElementById(`grid-${index}`);
            // El bingo se llena por filas, pero tenemos columnas
            for(let fila=0; fila<5; fila++) {
                ['B','I','N','G','O'].forEach(letra => {
                    const valor = columnas[letra][fila];
                    const celda = document.createElement('div');
                    celda.className = valor === "FREE" ? "celda centro marcada" : "celda";
                    celda.innerText = valor === "FREE" ? "CLUB" : valor;
                    
                    // Al tocar una celda, el socio la marca
                    celda.onclick = () => celda.classList.toggle('marcada');
                    grid.appendChild(celda);
                });
            }
        }

        // 4. VALIDACIÓN DE GANADOR SEGÚN VARIACIÓN
        window.verificarGanador = () => {
            if(!salaActual) return;
            
            const bolasCantadas = salaActual.bolas;
            const cartonesDOM = document.querySelectorAll('.carton-contenedor');
            let ganador = false;

            cartonesDOM.forEach((carton, idx) => {
                const celdas = carton.querySelectorAll('.celda');
                const marcadasYValidas = Array.from(celdas).filter(c => {
                    const num = c.innerText;
                    // El centro es válido siempre, lo demás debe estar en la lista de bolas de Firebase
                    return c.classList.contains('marcada') && (num === "CLUB" || bolasCantadas.some(b => b.includes(num)));
                });

                if(salaActual.tipo === 'cartonLleno') {
                    // Modalidad: Cartón Lleno (25 celdas marcadas y válidas)
                    if(marcadasYValidas.length === 25) ganador = true;
                } else {
                    // Modalidad: Normal (Línea o Cruz - Simplificado a Línea por ahora)
                    // Aquí podrías añadir lógica de líneas, pero para el MVP verificamos si tiene al menos 5 correctas
                    if(marcadasYValidas.length >= 5) ganador = true; 
                }
            });

            if(ganador) {
                alert("¡FELICIDADES! Has cantado BINGO. Espera la validación del administrador.");
                // Aquí podrías enviar una notificación a Firebase para avisar al admin
            } else {
                alert("Aún te faltan números o tienes números marcados que no han salido.");
            }
        };
    </script>
</body>
</html>

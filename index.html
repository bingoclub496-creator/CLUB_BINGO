<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Acceso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primario: #004d61; --secundario: #25D366; }
        body { 
            margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif;
            background: #000; color: white; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(0, 77, 97, 0.9); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; border: 2px solid var(--secundario);
            width: 85%; max-width: 350px; text-align: center;
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.2);
        }
        .logo-container img { width: 100px; filter: drop-shadow(0 0 10px var(--secundario)); margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 30px; letter-spacing: 2px; }
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: white; color: #333; font-size: 1.4rem; font-weight: 900;
            text-align: center; text-transform: uppercase; outline: none; margin-bottom: 20px;
        }
        button {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            background: var(--secundario); color: white; font-size: 1.1rem;
            font-weight: 900; cursor: pointer; text-transform: uppercase; 
        }
        #error-msg { color: #ff5252; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Bingo Club" onerror="this.style.display='none'">
        </div>

        <h1>BINGO CLUB</h1>

        <input type="text" id="codigoAcceso" placeholder="INGRESA TU CÓDIGO" maxlength="10">

        <button onclick="validarEntrada()">ENTRAR AL SORTEO</button>
        
        <div id="error-msg">⚠️ CÓDIGO NO ENCONTRADO</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.validarEntrada = async () => {
            const input = document.getElementById('codigoAcceso');
            const codigo = input.value.trim().toUpperCase();

            if (!codigo) return alert("Por favor, ingresa el código de tu cartón.");

            try {
                // Buscamos en la colección 'socios' el campo 'codigoAcceso'
                const q = query(collection(db, "socios"), where("codigoAcceso", "==", codigo));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const socioDoc = querySnapshot.docs[0];
                    const datos = socioDoc.data();

                    // Guardamos en la sesión para el siguiente archivo
                    sessionStorage.setItem('socioActual', JSON.stringify({
                        id: socioDoc.id,
                        nombre: datos.nombre,
                        idSala: datos.idSala,
                        cant: datos.cantCartones,
                        cod: datos.codigoAcceso
                    }));

                    alert("✅ ¡Código correcto! Bienvenido, " + datos.nombre);
                    
                    // Redirección al archivo de juego
                    window.location.href = "juego.html";
                    
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                    setTimeout(() => { document.getElementById('error-msg').style.display = 'none'; }, 3000);
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión: " + e.message);
            }
        };
    </script>
</body>
</html>

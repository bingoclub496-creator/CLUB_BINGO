<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Ingreso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial', sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; }
        .glass-panel { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.5); width: 85%; max-width: 350px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        .img-logo { width: 120px; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: bold; color: #444; box-sizing: border-box; text-transform: uppercase; }
        .btn-entrar { width: 100%; padding: 15px; background: #004d61; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-bottom: 25px; }
        .footer-text { color: #004d61; font-size: 0.9rem; margin-bottom: 15px; font-weight: bold; }
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 10px; background: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 25px; font-weight: bold; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="glass-panel">
        <img src="logo.png" class="img-logo">
        <input type="text" id="user" placeholder="USUARIO">
        <input type="password" id="pass" placeholder="CONTRASEÑA">
        <button class="btn-entrar" id="btnIngresar">ENTRAR AL CLUB</button>
        
        <p class="footer-text">¿Aún no tienes cuenta?</p>
        <a href="https://wa.me/584265709830" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Solicítala aquí
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4", 
            authDomain: "bingo-club-6f019.firebaseapp.com", 
            projectId: "bingo-club-6f019", 
            storageBucket: "bingo-club-6f019.firebasestorage.app", 
            messagingSenderId: "1059179173812", 
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function ingresar() {
            const u = document.getElementById('user').value.trim().toLowerCase();
            const p = document.getElementById('pass').value.trim();

            if(!u || !p) return alert("Completa los datos");

            const q = query(collection(db, "socios"), where("usuario", "==", u), where("password", "==", p));
            const snap = await getDocs(q);

            if (!snap.empty) {
                sessionStorage.setItem('socioLogueado', JSON.stringify({id: snap.docs[0].id, ...snap.docs[0].data()}));
                window.location.href = 'juego.html';
            } else {
                alert("Usuario o Clave incorrectos");
            }
        }
        document.getElementById('btnIngresar').onclick = ingresar;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Acceso Socios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial Black', sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; }
        .glass-panel { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 40px; border: 1.5px solid rgba(255, 255, 255, 0.4); width: 90%; max-width: 400px; padding: 40px 20px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); }
        .img-logo { width: 220px; margin-bottom: 15px; }
        
        .login-box { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .input-group { text-align: left; }
        .input-group label { color: #004d61; font-size: 0.9rem; margin-left: 10px; font-weight: 900; }
        
        input { width: 100%; padding: 18px; border: none; border-radius: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; color: #004d61; box-sizing: border-box; background: white; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        
        .btn-ingresar { width: 100%; padding: 20px; background: #004d61; color: white; border: none; border-radius: 15px; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-ingresar:active { transform: scale(0.95); }
        
        .error-msg { color: #d32f2f; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 15px; display: none; border-left: 5px solid red; }

        .footer-links { margin-top: 30px; }
        .solicita-link { display: flex; align-items: center; justify-content: center; gap: 10px; color: white; text-decoration: none; font-weight: 900; background: #25D366; padding: 15px; border-radius: 30px; font-size: 1rem; box-shadow: 0 5px 15px rgba(37,211,102,0.3); }
    </style>
</head>
<body>

    <div class="glass-panel">
        <img src="logo.png" alt="Bingo Club" class="img-logo">
        
        <div id="errorBox" class="error-msg">❌ Datos incorrectos o sin acceso.</div>

        <div class="login-box">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="USUARIO" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="passInput" placeholder="CONTRASEÑA">
            </div>
            <button class="btn-ingresar" id="btnEntrar">ENTRAR AL CLUB</button>
        </div>

        <div class="footer-links">
            <p style="color:#004d61; font-size: 0.9rem;">¿Aún no tienes cuenta?</p>
            <a href="https://wa.me/584265709830?text=Hola%20Bingo%20Club,%20deseo%20solicitar%20mi%20usuario%20y%20contraseña.%20Mi%20nombre%20es:" class="solicita-link" target="_blank">
                <i class="fab fa-whatsapp"></i> Solicítala aquí
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function login() {
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const btn = document.getElementById('btnEntrar');
            const errorBox = document.getElementById('errorBox');

            if(!user || !pass) return alert("Ingresa tus credenciales");

            btn.disabled = true;
            btn.innerText = "VERIFICANDO...";
            errorBox.style.display = "none";

            try {
                // Buscamos al socio por su nombre de usuario
                const q = query(collection(db, "socios"), where("usuario", "==", user));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    const docSocio = snap.docs[0];
                    const data = docSocio.data();

                    // Validamos la contraseña
                    if(data.password === pass) {
                        // Guardamos la sesión para que el juego sepa quién es
                        sessionStorage.setItem('idSocioActual', docSocio.id);
                        
                        // Redirigimos a la sala que tú le asignaste en Firebase
                        window.location.href = 'juego.html';
                    } else {
                        throw new Error("Clave incorrecta");
                    }
                } else {
                    throw new Error("Usuario no existe");
                }
            } catch (err) {
                errorBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "ENTRAR AL CLUB";
            }
        }

        document.getElementById('btnEntrar').addEventListener('click', login);
    </script>
</body>
</html>

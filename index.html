<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Acceso Clientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primario: #004d61; --secundario: #25D366; }
        body { 
            margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif;
            background: #000; color: white; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: rgba(0, 77, 97, 0.9); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; border: 2px solid var(--secundario);
            width: 85%; max-width: 350px; text-align: center;
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.2);
        }
        .logo-container { margin-bottom: 25px; }
        .logo-container img { width: 100px; filter: drop-shadow(0 0 10px var(--secundario)); }
        
        h1 { font-size: 1.5rem; margin-bottom: 30px; letter-spacing: 2px; color: white; }
        
        .input-group { text-align: left; margin-bottom: 25px; }
        label { font-size: 0.7rem; opacity: 0.8; margin-left: 5px; text-transform: uppercase; }
        
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid transparent;
            background: white; color: #333; font-size: 1.4rem; font-weight: 900;
            text-align: center; text-transform: uppercase; outline: none; margin-top: 5px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--secundario); box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }

        button {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            background: var(--secundario); color: white; font-size: 1.1rem;
            font-weight: 900; cursor: pointer; text-transform: uppercase; 
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.98); }
        
        #error-msg { 
            color: #ff5252; font-size: 0.85rem; margin-top: 15px; 
            display: none; font-weight: bold; background: rgba(255,82,82,0.1);
            padding: 10px; border-radius: 8px;
        }

        .loader {
            display: none; border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top: 4px solid var(--secundario);
            width: 24px; height: 24px; animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Bingo Club" onerror="this.style.display='none'">
            <i class="fas fa-ticket-alt" id="fallback-icon" style="display:none; font-size: 4rem; color: var(--secundario);"></i>
        </div>

        <h1>BINGO CLUB</h1>

        <div class="input-group">
            <label>Código de Invitación:</label>
            <input type="text" id="codigoAcceso" placeholder="EJ: XJ82K" maxlength="10" autocomplete="off">
        </div>

        <button id="btnEntrar" onclick="validarEntrada()">ENTRAR AL SORTEO</button>
        
        <div class="loader" id="loading"></div>
        <div id="error-msg">⚠️ CÓDIGO INCORRECTO O NO REGISTRADO</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de Firebase (Debe ser idéntica a la del Admin)
        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Si la imagen falla, mostrar icono de respaldo
        const img = document.querySelector('.logo-container img');
        img.onerror = () => {
            img.style.display = 'none';
            document.getElementById('fallback-icon').style.display = 'block';
        };

        window.validarEntrada = async () => {
            const input = document.getElementById('codigoAcceso');
            const btn = document.getElementById('btnEntrar');
            const loader = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');
            
            const codigo = input.value.trim().toUpperCase();

            if (!codigo) {
                input.focus();
                return;
            }

            // UI State
            errorMsg.style.display = 'none';
            btn.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Buscamos en la colección 'socios' (tal cual lo guarda el app.js del admin)
                const q = query(collection(db, "socios"), where("codigoAcceso", "==", codigo));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const socioDoc = querySnapshot.docs[0];
                    const datosSocio = socioDoc.data();

                    // Guardar datos en la sesión para que juego.html sepa quién es
                    sessionStorage.setItem('socioActual', JSON.stringify({
                        id: socioDoc.id,
                        nombre: datosSocio.nombre,
                        idSala: datosSocio.idSala,
                        cantCartones: datosSocio.cantCartones,
                        codigoAcceso: datosSocio.codigoAcceso
                    }));

                    // Redirección exitosa
                    window.location.href = "juego.html";
                } else {
                    throw new Error("No encontrado");
                }
            } catch (e) {
                console.error("Error validando:", e);
                loader.style.display = 'none';
                btn.style.display = 'block';
                errorMsg.style.display = 'block';
                input.value = "";
                input.focus();
            }
        };

        // Permitir entrar con la tecla Enter
        document.getElementById('codigoAcceso').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') validarEntrada();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Club - Acceso Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primario: #004d61; --secundario: #25D366; }
        
        body { 
            margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif;
            background: #000; color: white; display: flex; align-items: center; justify-content: center;
        }

        /* RECUPERANDO TU DISEÑO: Tarjeta con desenfoque y borde verde */
        .login-card {
            background: rgba(0, 77, 97, 0.8); /* Tu azul translúcido */
            backdrop-filter: blur(15px);
            padding: 40px; border-radius: 25px; 
            border: 2px solid var(--secundario); /* El borde verde neón */
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
        }
        
        .logo-app { 
            width: 100px; height: 100px; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center;
        }
        
        .logo-app img { max-width: 100%; filter: drop-shadow(0 0 10px var(--secundario)); }

        /* Estilo de los textos que tenías */
        h1 { font-size: 1.4rem; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
        
        .label-acceso { text-align: left; font-size: 0.75rem; opacity: 0.8; margin-bottom: 8px; display: block; }

        input {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            background: white; color: #333; font-size: 1.5rem; font-weight: 900;
            text-align: center; text-transform: uppercase; margin-bottom: 25px; outline: none;
        }

        button {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            background: var(--secundario); color: white; font-size: 1.2rem;
            font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        
        button:hover { background: #1eb954; transform: scale(1.02); }

        #error-msg { color: #ff5252; font-size: 0.9rem; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-app">
            <img src="logo.png" alt="Bingo Club" onerror="this.style.display='none'">
        </div>

        <h1>BINGO CLUB</h1>
        
        <span class="label-acceso">CÓDIGO DE ACCESO:</span>
        <input type="text" id="codigoAcceso" placeholder="ABC123" maxlength="10">
        
        <button onclick="validarEntrada()">ENTRAR AL SORTEO</button>
        
        <div id="error-msg">❌ CÓDIGO NO VÁLIDO</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1GIQ1xaJUINYabyqOejrlfjqUAcoQwg4",
            authDomain: "bingo-club-6f019.firebaseapp.com",
            projectId: "bingo-club-6f019",
            storageBucket: "bingo-club-6f019.firebasestorage.app",
            messagingSenderId: "1059179173812",
            appId: "1:1059179173812:web:78b43eaac565d213bec4e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.validarEntrada = async () => {
            const input = document.getElementById('codigoAcceso');
            const codigo = input.value.trim().toUpperCase();

            if (!codigo) return;

            try {
                const q = query(collection(db, "socios"), where("codigoAcceso", "==", codigo));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const datos = querySnapshot.docs[0].data();
                    sessionStorage.setItem('socioActual', JSON.stringify({
                        id: querySnapshot.docs[0].id,
                        ...datos
                    }));
                    window.location.href = "juego.html";
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión");
            }
        };
    </script>
</body>
</html>

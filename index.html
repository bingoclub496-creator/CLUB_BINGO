<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* TU CONFIGURACIÓN AQUÍ */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('btnIngresar').addEventListener('click', async () => {
        const u = document.getElementById('user').value.trim().toLowerCase();
        const p = document.getElementById('pass').value.trim();
        const btn = document.getElementById('btnIngresar');

        if(!u || !p) return alert("⚠️ Rellena los campos.");

        btn.disabled = true;
        btn.innerText = "VERIFICANDO...";

        try {
            // EL FILTRO CRÍTICO: solo buscamos usuarios que tengan activo: true
            const q = query(
                collection(db, "socios"), 
                where("usuario", "==", u), 
                where("password", "==", p),
                where("activo", "==", true) // <--- SI ESTÁ APAGADO, NO LO ENCONTRARÁ
            );
            
            const snap = await getDocs(q);

            if (!snap.empty) {
                const datos = { id: snap.docs[0].id, ...snap.docs[0].data() };
                sessionStorage.setItem('socioLogueado', JSON.stringify(datos));
                window.location.href = 'juego.html';
            } else {
                alert("❌ ACCESO DENEGADO: Usuario incorrecto, clave errónea o falta de pago.");
                btn.disabled = false;
                btn.innerText = "ENTRAR AL CLUB";
            }
        } catch (e) {
            alert("Error de conexión");
            btn.disabled = false;
        }
    });
</script>
